name: pi-durable-fit

on:
  push:
    paths:
      - 'spike/pi-durable-fit/**'
      - 'uas/ledger.py'
      - '.github/workflows/pi-durable-fit.yml'
  pull_request:
    paths:
      - 'spike/pi-durable-fit/**'
      - 'uas/ledger.py'
      - '.github/workflows/pi-durable-fit.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  model-free-fit:
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install exact registry lock without lifecycle scripts or account settings
        run: sh spike/pi-durable-fit/install-dependencies.sh
      - name: Six model-free tests with no test-process network
        shell: bash
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(command -v node)")"
          runner_user="$(id -un)"
          # New child namespace only; no host routes/interfaces are changed.
          # Drop back to the runner before tests. Failure has no networked fallback.
          sudo unshare --net -- sudo -u "$runner_user" -- \
            env PATH="$node_dir:/usr/bin:/bin" sh spike/pi-durable-fit/run-tests.sh
