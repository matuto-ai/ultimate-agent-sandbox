name: pi-native

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  official-pi-native:
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install locked official Pi without lifecycle scripts or account configuration
        run: sh tests/pi/install-dependencies.sh
      - name: Require actual Pi extension and RPC across the durable Hub seam
        shell: bash
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(command -v node)")"
          runner_user="$(id -un)"
          # Child network namespace only. No host networking modification and no
          # networked fallback. Pi itself also gets clean HOME/env + API guards.
          sudo unshare --net -- sudo -u "$runner_user" -- \
            env PATH="$node_dir:/usr/bin:/bin" sh tests/pi/run-tests.sh
