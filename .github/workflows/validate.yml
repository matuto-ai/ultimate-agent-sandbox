name: validate

on:
  push:
  pull_request:

# Supersede only the same PR; pushes keep independent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    outputs:
      skip_tests: ${{ steps.changes.outputs.skip_tests }}
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect test applicability
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          only_exempt_paths() (
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git cat-file -e "$base^{commit}" 2>/dev/null || exit 1
            changes="$(mktemp)" || exit 1
            trap 'rm -f "$changes"' EXIT
            # Keep source deletions visible when files move into an exempt folder.
            git diff --name-only -z --no-renames "$base" HEAD -- > "$changes" || exit 1
            [[ -s "$changes" ]] || exit 1
            while IFS= read -r -d '' path; do
              case "$path" in
                # Extend only with folders that have no runtime, test, or build inputs.
                docs/*) ;;
                *) exit 1 ;;
              esac
            done < "$changes"
          )

          skip_tests=false
          if only_exempt_paths; then
            skip_tests=true
          fi
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

      # Give every test-only setup/check step this condition, not the whole job.
      - name: Install pinned Python dependencies
        if: steps.changes.outputs.skip_tests != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/uas-python"
          "$RUNNER_TEMP/uas-python/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
          echo "$RUNNER_TEMP/uas-python/bin" >> "$GITHUB_PATH"

      - name: Validate successor interfaces
        if: steps.changes.outputs.skip_tests != 'true'
        env:
          UAS_REQUIRE_UNIX_PEER_TESTS: "1"
          UAS_REQUIRE_PARTICIPANT_PROCESS_TESTS: "1"
          UAS_WORKSTATION_CONNECTOR_TEST: "1"
          UAS_FORGE_HTTP_TEST: "1"
          UAS_FORGE_CHANNEL_TEST: "1"
        run: ./validate.sh remainder

      - name: Check account-free local CLI process lifecycle
        if: steps.changes.outputs.skip_tests != 'true'
        env:
          UAS_LOCAL_PROCESS_SMOKE: "1"
        # Keep the bounded process smoke in the measured remainder lane.
        run: timeout --signal=TERM --kill-after=1s 15s python3 tests/linux/local_process_smoke.py --run

      - name: Report tests not applicable
        if: steps.changes.outputs.skip_tests == 'true'
        run: echo 'Tests not applicable — every changed path is in the exempt-folder allowlist. Tests did not run; this exemption is not runtime or security evidence.'

  unit-slow:
    outputs:
      skip_tests: ${{ steps.changes.outputs.skip_tests }}
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect test applicability
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          only_exempt_paths() (
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git cat-file -e "$base^{commit}" 2>/dev/null || exit 1
            changes="$(mktemp)" || exit 1
            trap 'rm -f "$changes"' EXIT
            # Keep source deletions visible when files move into an exempt folder.
            git diff --name-only -z --no-renames "$base" HEAD -- > "$changes" || exit 1
            [[ -s "$changes" ]] || exit 1
            while IFS= read -r -d '' path; do
              case "$path" in
                # Extend only with folders that have no runtime, test, or build inputs.
                docs/*) ;;
                *) exit 1 ;;
              esac
            done < "$changes"
          )

          skip_tests=false
          if only_exempt_paths; then
            skip_tests=true
          fi
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

      # Give every test-only setup/check step this condition, not the whole job.
      - name: Install pinned Python dependencies
        if: steps.changes.outputs.skip_tests != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/uas-python"
          "$RUNNER_TEMP/uas-python/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
          echo "$RUNNER_TEMP/uas-python/bin" >> "$GITHUB_PATH"

      - name: Validate measured slow unit partition
        if: steps.changes.outputs.skip_tests != 'true'
        env:
          UAS_REQUIRE_UNIX_PEER_TESTS: "1"
          UAS_REQUIRE_PARTICIPANT_PROCESS_TESTS: "1"
          UAS_WORKSTATION_CONNECTOR_TEST: "1"
          UAS_FORGE_HTTP_TEST: "1"
          UAS_FORGE_CHANNEL_TEST: "1"
        run: ./validate.sh slow

      - name: Report tests not applicable
        if: steps.changes.outputs.skip_tests == 'true'
        run: echo 'Tests not applicable — every changed path is in the exempt-folder allowlist. Tests did not run; this exemption is not runtime or security evidence.'

  unit-integration:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {partition: integration, name: unit-integration}
          - {partition: additional, name: unit-additional}
          - {partition: synthesis, name: unit-synthesis}
          - {partition: scheduler, name: unit-scheduler}
          - {partition: operator, name: unit-operator}
          - {partition: inspection, name: unit-inspection}
          - {partition: lifecycle, name: unit-lifecycle}
          - {partition: disposition, name: unit-disposition}
    outputs:
      skip_tests: ${{ steps.changes.outputs.skip_tests }}
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect test applicability
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          only_exempt_paths() (
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git cat-file -e "$base^{commit}" 2>/dev/null || exit 1
            changes="$(mktemp)" || exit 1
            trap 'rm -f "$changes"' EXIT
            # Keep source deletions visible when files move into an exempt folder.
            git diff --name-only -z --no-renames "$base" HEAD -- > "$changes" || exit 1
            [[ -s "$changes" ]] || exit 1
            while IFS= read -r -d '' path; do
              case "$path" in
                # Extend only with folders that have no runtime, test, or build inputs.
                docs/*) ;;
                *) exit 1 ;;
              esac
            done < "$changes"
          )

          skip_tests=false
          if only_exempt_paths; then
            skip_tests=true
          fi
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

      # Give every test-only setup/check step this condition, not the whole job.
      - name: Install pinned Python dependencies
        if: steps.changes.outputs.skip_tests != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/uas-python"
          "$RUNNER_TEMP/uas-python/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
          echo "$RUNNER_TEMP/uas-python/bin" >> "$GITHUB_PATH"

      - name: Validate measured integration unit partition
        if: steps.changes.outputs.skip_tests != 'true'
        env:
          UAS_REQUIRE_UNIX_PEER_TESTS: "1"
          UAS_REQUIRE_PARTICIPANT_PROCESS_TESTS: "1"
          UAS_WORKSTATION_CONNECTOR_TEST: "1"
          UAS_FORGE_HTTP_TEST: "1"
          UAS_FORGE_CHANNEL_TEST: "1"
        run: ./validate.sh ${{ matrix.partition }}

      - name: Report tests not applicable
        if: steps.changes.outputs.skip_tests == 'true'
        run: echo 'Tests not applicable — every changed path is in the exempt-folder allowlist. Tests did not run; this exemption is not runtime or security evidence.'

  forge-broker-smoke:
    # Preserve both required Forge checks without serializing them with the
    # aggregate. All downstream jobs must succeed for this workflow to pass.
    # runtime-budget checks the complete two-stage critical path.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check external read Broker credential separation
        run: timeout --signal=TERM --kill-after=2s 25s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/forge_read_smoke.py
      - name: Check bounded mutation Broker and private credentials
        run: timeout --signal=TERM --kill-after=2s 25s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/forge_mutation_smoke.py


  artifact-linux-smoke:
    # Fast real Linux seams, NOT stock-policy/native/VM qualification.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check actual nonroot artifact paths, listeners and copied Git
        run: timeout --signal=TERM --kill-after=2s 43s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/artifact_smoke.py --run

  docker-lifecycle:
    # This is fixture lifecycle evidence, not production launch qualification.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise actual disposable Docker lifecycle
        run: ./tests/docker-lifecycle.sh

  git-native-seams:
    # Account-free actual seams, not OpenSSH/GitHub or exact Pi image qualification.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile-check fixed credential-free connector
        run: cc -fsyntax-only -Wall -Wextra -Werror runtime/workstation/git_worker_connector.c
      - name: Check reviewed private native Git seams in parallel
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=2s 42s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/git_smoke.py & runtime=$!
          timeout --signal=TERM --kill-after=2s 37s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/git_stream_smoke.py & stream=$!
          timeout --signal=TERM --kill-after=2s 17s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/git_process_smoke.py & ancestry=$!
          timeout --signal=TERM --kill-after=2s 42s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/git_composition_smoke.py & composition=$!
          timeout --signal=TERM --kill-after=2s 29s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/room_service_smoke.py & room_protocol=$!
          status=0
          for child in "$runtime" "$stream" "$ancestry" "$composition" "$room_protocol"; do
            wait "$child" || status=1
          done
          exit "$status"

  gate-linux-smoke:
    # Focused reviewed diff/Broker seams, not command runtime or VM qualification.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check exact diff and external Gate Broker in parallel
        shell: bash
        run: |
          set +e
          # Avoid overlapping the two fixed GCC builds with process-heavy Brokers.
          # This mitigates possible contention; the previous timeout's cause is unproven.
          log=$(mktemp) || exit 1
          trap 'rm -f "$log"' EXIT
          timeout --signal=TERM --kill-after=2s 40s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS,GITHUB_SHA /usr/bin/python3 tests/linux/diff_smoke.py --run >"$log" 2>&1 & diff=$!
          status=0
          ready=false
          deadline=$((SECONDS + 15))
          while (( SECONDS < deadline )); do
            # Check the marker first: a completed diff may already have emitted it.
            if grep -Fxq '{"stage": "build-ready"}' "$log"; then ready=true; break; fi
            kill -0 "$diff" 2>/dev/null || break
            sleep .05
          done
          children=("$diff")
          if "$ready"; then
            timeout --signal=TERM --kill-after=2s 15s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/gate_forge_smoke.py & broker=$!
            children+=("$broker")
            timeout --signal=TERM --kill-after=2s 30s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS /usr/bin/python3 tests/linux/review_forge_smoke.py & review=$!
            children+=("$review")
          else
            echo 'Diff build barrier failed; Broker siblings were not started.'
            status=1
          fi
          # No build marker is qualification: retain every launched final status.
          # Nominal overlap: max(diff 40s, barrier 15s + review 30s) =45s.
          # Kill grace, polling and setup add time; the existing 1min job cap rules.
          for child in "${children[@]}"; do
            wait "$child" || status=1
          done
          cat "$log" || status=1
          rm -f "$log" || status=1
          trap - EXIT
          exit "$status"

  gate-command-native:
    # Reviewed isolated one-shot Linux seam; never a VM or production admission.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check reviewed command_smoke.py one-shot profile
        run: timeout --signal=TERM --kill-after=2s 65s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS,GITHUB_SHA /usr/bin/python3 tests/linux/command_smoke.py --run

  gate-artifact-native:
    # Reviewed isolated one-shot Linux seam; never a VM or production admission.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check reviewed artifact_native_smoke.py one-shot profile
        run: timeout --signal=TERM --kill-after=2s 43s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS,GITHUB_SHA /usr/bin/python3 tests/linux/artifact_native_smoke.py --run

  room-control-plane:
    # Actual account-free persistent service lifetime; no VM/native admission.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check persistent real Room services and authenticated Start
        env:
          UAS_ROOM_CONTROL_TEST: '1'
          UAS_MANAGER_TLS_TEST: '1'
        run: timeout --signal=TERM --kill-after=2s 75s sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS,UAS_ROOM_CONTROL_TEST,UAS_MANAGER_TLS_TEST /usr/bin/python3 tests/linux/room_control_smoke.py

  manager-mtls:
    # Temporary test certificates and loopback sockets only; no production credentials.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check two-Room HTTPS replay and certificate isolation
        env:
          UAS_MANAGER_TLS_TEST: "1"
        run: PYTHONPATH=tests timeout --signal=TERM --kill-after=2s 40s python3 -m unittest test_manager_tls test_native_human_tls -v

  manager-field-notes:
    # Reuses the existing check entrypoint and runner's installed Chrome.
    # No download/server/sandbox bypass.
    needs: [validate, unit-slow, unit-integration]
    if: ${{ needs.validate.outputs.skip_tests != 'true' && needs.unit-slow.outputs.skip_tests != 'true' && needs.unit-integration.outputs.skip_tests != 'true' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Capture live read-model fixtures and check existing Field Notes UI
        env:
          PYTHONPATH: .
          UAS_MANAGER_BROWSER_TEST: "1"
        run: |
          python3 tests/test_manager_ui.py --write-browser-fixtures "$RUNNER_TEMP/manager-field-notes"
          timeout --signal=TERM --kill-after=2s 40s node spike/manager-ui/check.cjs --fixtures "$RUNNER_TEMP/manager-field-notes" --browser
      - name: Retain bounded browser proof for independent pixel inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manager-field-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/manager-field-notes/browser-proof/
          if-no-files-found: warn
          retention-days: 7

  runtime-budget:
    name: ${{ github.workflow }} runtime budget
    needs: [validate, unit-slow, unit-integration, forge-broker-smoke, artifact-linux-smoke, docker-lifecycle, git-native-seams, gate-linux-smoke, gate-command-native, gate-artifact-native, room-control-plane, manager-mtls, manager-field-notes]
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce measured runtime growth and absolute ceiling
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B tests/ci_runtime_budget.py validate.yml --base "$BASE_SHA"
