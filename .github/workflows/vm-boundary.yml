name: vm-boundary

on:
  pull_request:
    paths: ['uas/**', 'tests/vm/**', 'tests/test_guest_fixture.py', '.github/workflows/vm-boundary.yml']
  push:
    branches: [main]
    paths: ['uas/**', 'tests/vm/**', 'tests/test_guest_fixture.py', '.github/workflows/vm-boundary.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  docker-network-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install disposable runner image/payload tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils gnupg dnf dnf-plugins-core rpm createrepo-c genisoimage
      - name: Exercise actual guest-only Docker network and quotas
        run: python3 tests/vm/run_boundary.py
