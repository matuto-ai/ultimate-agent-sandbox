name: vm-boundary

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-network-quota:
    # Deliberate qualification only, never routine push/PR synchronization.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'qualify-vm-boundary' && github.event.sender.login == 'puglab-reviewer' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install disposable runner image/payload tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils gnupg dnf dnf-plugins-core rpm createrepo-c genisoimage
      - name: Exercise actual guest-only Docker network and quotas
        run: python3 tests/vm/run_boundary.py
