name: room-launch

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  composed-room-boundary:
    # Network-enabled fixed fixture: deliberate exact-candidate review only.
    # This is never part of routine push/PR synchronization or the 3-minute CI.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'qualify-room-launch' && github.event.sender.login == 'puglab-reviewer' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install signed disposable runner image tools
        timeout-minutes: 10
        run: python3 tests/vm/install_runner_tools.py boundary
      - name: Exercise fixed IPv4 Room launch and owned cleanup
        env:
          UAS_ROOM_VM_PROFILE: room-launch-ipv4-v1
        run: python3 tests/vm/run_room.py
