name: room-launch

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact reviewed warm-guest qualification scenario
        required: false
        default: room-boundary
        type: choice
        options:
          - room-boundary
          - library-installation
      producer_run_id:
        description: Exact reviewed successful preparation run ID
        required: true
        type: string
      artifact_id:
        description: Exact artifact ID from that run
        required: true
        type: string
      producer_commit:
        description: Exact 40-character reviewed preparation commit
        required: true
        type: string
      receipt_sha256:
        description: Independently reviewed receipt SHA256 from producer log
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  composed-room-boundary:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.actor == 'puglab-reviewer') || (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'qualify-room-launch' || github.event.label.name == 'qualify-library-installation') && github.event.sender.login == 'puglab-reviewer' && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exactly one explicitly selected warm scenario
        env:
          SELECTED_SCENARIO: ${{ inputs.scenario }}
          SELECTED_LABEL: ${{ github.event.label.name }}
        run: |
          python3 - <<'PYTHON'
          import os
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              selected = os.environ['SELECTED_SCENARIO'] or 'room-boundary'
              if selected not in ('room-boundary', 'library-installation'):
                  raise ValueError('one reviewed warm scenario required')
          elif os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              if os.environ['SELECTED_LABEL'] not in ('qualify-room-launch', 'qualify-library-installation'):
                  raise ValueError('exact qualification label required')
          else:
              raise ValueError('deliberate qualification event required')
          PYTHON
      - name: Fetch explicit reviewed PR selection, with no cold fallback
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tests/vm/fetch_prepared_room.py
          --selection-file tests/vm/prepared-room-selection.json
          --output "$RUNNER_TEMP/room-prepared"
      - name: Fetch explicit dispatch selection, with no cold fallback
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          PRODUCER_COMMIT: ${{ inputs.producer_commit }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
        run: >-
          python3 tests/vm/fetch_prepared_room.py
          --producer-run-id "$PRODUCER_RUN_ID" --artifact-id "$ARTIFACT_ID"
          --producer-commit "$PRODUCER_COMMIT" --receipt-sha256 "$RECEIPT_SHA256"
          --output "$RUNNER_TEMP/room-prepared"
      - name: Bind verified receipt for the warm consumer
        env:
          SELECTED_RECEIPT: ${{ inputs.receipt_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              digest = json.loads(pathlib.Path('tests/vm/prepared-room-selection.json').read_text())['receipt']
          else:
              digest = os.environ['SELECTED_RECEIPT']
          if not re.fullmatch('[0-9a-f]{64}', digest): raise ValueError('explicit receipt digest required')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('UAS_ROOM_PREPARED_SHA256=' + digest + '\n')
          PYTHON
      - name: Install signed disposable runner image tools
        timeout-minutes: 10
        run: python3 tests/vm/install_runner_tools.py boundary
      - name: Exercise fresh Room launch using verified clean preparation
        if: ${{ github.event.label.name == 'qualify-room-launch' || (github.event_name == 'workflow_dispatch' && (inputs.scenario == 'room-boundary' || inputs.scenario == '')) }}
        env:
          UAS_ROOM_VM_PROFILE: room-launch-ipv4-v1
          UAS_ROOM_EXECUTION: warm
          UAS_ROOM_PREPARED_DIR: ${{ runner.temp }}/room-prepared
        run: python3 tests/vm/run_room.py
      - name: Exercise actual installed Library on two Rooms using verified clean preparation
        if: ${{ github.event.label.name == 'qualify-library-installation' || (github.event_name == 'workflow_dispatch' && inputs.scenario == 'library-installation') }}
        env:
          UAS_LIBRARY_VM_APPROVED: '1'
          UAS_LIBRARY_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          UAS_ROOM_VM_PROFILE: room-launch-ipv4-v1
          UAS_ROOM_EXECUTION: warm
          UAS_ROOM_PREPARED_DIR: ${{ runner.temp }}/room-prepared
        run: python3 tests/vm/run_library_installation.py
