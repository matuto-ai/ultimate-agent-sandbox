name: claude-native

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  official-claude-fixture:
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Acquire exact official package without lifecycle scripts or account configuration
        run: sh tests/claude/install-dependencies.sh
      - name: Actual Claude CLI against loopback protocol fixture, never upstream
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          # This modifies only a disposable child network namespace. No host
          # routes, firewall, interfaces, managed policy, or credentials change.
          sudo unshare --net -- sh -c 'ip link set lo up; exec sudo -u "$1" -- env -i PATH=/usr/bin:/bin UAS_CLAUDE_INSTALL="$2/tests/claude" sh "$2/tests/claude/run-tests.sh"' sh "$runner_user" "$PWD"
