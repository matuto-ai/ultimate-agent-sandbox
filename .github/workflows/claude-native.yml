name: claude-native

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  official-claude-fixture:
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install hash-pinned Library parser for real capture fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/uas-python"
          "$RUNNER_TEMP/uas-python/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      # Only public npm content-addressed acquisition bytes, never installed
      # modules, HOME, npm configuration, logs, or account/session files.
      - name: Restore exact locked public npm acquisition cache
        id: claude-npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/claude/.npm-cache/_cacache
            tests/claude/sdk/.npm-cache/_cacache
          key: claude-npm-v1-${{ runner.os }}-${{ runner.arch }}-node24.22.1-${{ hashFiles('tests/claude/package-lock.json', 'tests/claude/sdk/package-lock.json') }}
      - name: Acquire exact official package without lifecycle scripts or account configuration
        run: sh tests/claude/install-dependencies.sh
      - name: Acquire matching official TypeScript SDK without extra native binaries or scripts
        run: sh tests/claude/sdk/install-dependencies.sh
      # Save after verified npm ci, not at job teardown: a cold acquisition may
      # still exceed the fixed job budget. A cache is an optimization, not proof.
      - name: Save verified public acquisition bytes before fixture execution
        if: ${{ steps.claude-npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/claude/.npm-cache/_cacache
            tests/claude/sdk/.npm-cache/_cacache
          key: ${{ steps.claude-npm-cache.outputs.cache-primary-key }}
      - name: Actual Claude CLI against loopback protocol fixture, never upstream
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          node_path="$(command -v node)"
          # This modifies only a disposable child network namespace. No host
          # routes, firewall, interfaces, managed policy, or credentials change.
          sudo unshare --net -- sh -c 'ip link set lo up; exec sudo -u "$1" -- env -i PATH="$4/bin:/usr/bin:/bin" UAS_CLAUDE_INSTALL="$2/tests/claude" UAS_CLAUDE_SDK_INSTALL="$2/tests/claude/sdk" UAS_CLAUDE_NODE="$3" sh "$2/tests/claude/run-tests.sh"' sh "$runner_user" "$PWD" "$node_path" "$RUNNER_TEMP/uas-python"
