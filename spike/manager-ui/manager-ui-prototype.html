<!doctype html>
<!-- Field Notes live read-only consumer. Selected light/dark design; no workflow authority. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manager — Field Notes</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#e9e7df;
      --surface:#f7f5ed;
      --surface-2:#ddd9cf;
      --text:#171a1b;
      --muted:#626969;
      --quiet:#858b89;
      --line:#babbb6;
      --accent:#1c5a61;
      --accent-2:#103c41;
      --good:#2f745b;
      --warn:#9d6610;
      --bad:#aa3832;
      --unknown:#685f79;
      --focus:#006bc7;
      --shadow:0 20px 60px rgb(18 22 22 / 18%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); }
    body { margin:0; min-width:320px; background:var(--bg); color:var(--text); }
    button,input,textarea,select { font:inherit; }
    button,a,summary { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    a { color:inherit; text-decoration:none; }
    button { color:inherit; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:12px; font-size:clamp(2rem,5vw,5.2rem); line-height:.94; letter-spacing:-.055em; }
    h2 { margin-bottom:9px; font-size:1.08rem; letter-spacing:-.02em; }
    h3 { margin-bottom:6px; font-size:.9rem; }
    p { line-height:1.55; }
    ul { margin-top:8px; }
    .s-main,.s-main-content,.folio-side-note { min-width:0; overflow-wrap:anywhere; }
    .gate-ledger-copy { overflow-wrap:anywhere; }
    .live-fields { margin:0; overflow-wrap:anywhere; }
    .live-fields>div { display:grid; grid-template-columns:minmax(90px,1fr) minmax(0,2fr); gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
    .live-fields dt { color:var(--muted); }
    .live-fields dd { margin:0; }
    .live-current { border-left-color:var(--line); background:var(--surface-2); }
    .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .muted { color:var(--muted); }
    .quiet { color:var(--quiet); }
    .small { font-size:.81rem; }
    .tiny { font-size:.72rem; }
    .caps { color:var(--quiet); font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .row { display:flex; align-items:center; gap:9px; }
    .row.wrap { flex-wrap:wrap; }
    .row.between { justify-content:space-between; }
    .stack { display:grid; gap:12px; }
    .stack-lg { display:grid; gap:28px; }
    .divider { height:1px; background:var(--line); }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 13px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--text); cursor:pointer; font-size:.79rem; font-weight:720; }
    .btn:hover { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 6%,var(--surface)); }
    .btn.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
    .btn.danger { border-color:var(--bad); color:var(--bad); }
    .btn.ghost { border-color:transparent; background:transparent; }
    .btn:disabled { opacity:.48; cursor:not-allowed; }
    .text-link { color:var(--accent); font-weight:720; text-decoration:underline; text-underline-offset:4px; }
    .text-link:hover { text-decoration-thickness:2px; }
    .action-line { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .status { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:.76rem; font-weight:700; white-space:nowrap; }
    .status::before { content:""; width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--unknown); }
    .status.good::before { background:var(--good); }
    .status.warn::before { background:var(--warn); }
    .status.bad::before { background:var(--bad); }
    .status.unknown::before { background:var(--unknown); }
    .truth { color:var(--muted); font-size:.75rem; line-height:1.45; }
    .truth strong { color:var(--text); }
    .source { margin-left:5px; color:var(--quiet); font-size:.7rem; }
    .avatar { display:grid; place-items:center; flex:0 0 auto; width:36px; height:36px; border-radius:50%; background:color-mix(in srgb,var(--accent) 14%,var(--surface)); color:var(--accent-2); font-size:.72rem; font-weight:850; }
    .snapshot { margin:24px 0; padding:13px 15px; border-left:4px solid var(--bad); background:color-mix(in srgb,var(--bad) 8%,var(--surface)); font-size:.82rem; line-height:1.5; }
    .disabled-note { width:100%; color:var(--bad); font-size:.76rem; }
    .page-lede { max-width:760px; color:var(--muted); }
    .page-code { margin-bottom:9px; color:var(--accent); font:800 .71rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .page-rule { height:4px; margin:26px 0 34px; background:var(--text); }
    details { border-top:1px solid var(--line); }
    details:last-child { border-bottom:1px solid var(--line); }
    summary { min-height:44px; padding:12px 4px; cursor:pointer; font-size:.82rem; font-weight:720; }
    details>div { padding:2px 4px 15px; color:var(--muted); font-size:.81rem; line-height:1.5; }
    progress { width:100%; height:8px; accent-color:var(--accent); }
    .empty { padding:42px 12px; color:var(--muted); text-align:center; }

    .global-nav { display:flex; align-items:center; gap:4px; }
    .global-nav a { display:flex; align-items:center; min-height:44px; padding:8px 12px; border-radius:7px; color:var(--muted); font-size:.79rem; font-weight:720; }
    .global-nav a:hover { color:var(--text); background:color-mix(in srgb,var(--text) 5%,transparent); }
    .global-nav a[aria-current="page"] { color:var(--text); background:var(--surface-2); }
    .count { min-width:23px; margin-left:7px; padding:2px 6px; border-radius:999px; background:#dfb54b; color:#35280a; font-size:.66rem; text-align:center; }
    .project-line { display:grid; grid-template-columns:minmax(220px,1.4fr) minmax(190px,1fr) 110px 110px auto; gap:20px; align-items:center; min-height:82px; padding:14px 5px; border-bottom:1px solid var(--line); }
    .project-line.header { min-height:34px; color:var(--quiet); font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .project-name { font-size:.94rem; font-weight:790; }
    .sub { margin-top:4px; color:var(--muted); font-size:.74rem; }
    .attention-line { display:grid; grid-template-columns:16px minmax(0,1fr) auto; gap:13px; align-items:start; width:100%; min-height:72px; padding:15px 5px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; cursor:pointer; }
    .attention-line:hover { background:color-mix(in srgb,var(--accent) 5%,transparent); }
    .signal { width:10px; height:10px; margin-top:5px; border-radius:50%; background:var(--warn); }
    .attention-line.high .signal { background:var(--bad); }
    .attention-line.low .signal { background:var(--unknown); }
    .attention-title { font-size:.87rem; font-weight:770; }
    .attention-summary { display:block; margin-top:4px; color:var(--muted); font-size:.76rem; line-height:1.4; }
    .attention-age { color:var(--quiet); font-size:.72rem; white-space:nowrap; }
    .run-line { display:grid; grid-template-columns:minmax(220px,1.35fr) 130px 120px auto; gap:18px; align-items:center; min-height:76px; padding:13px 5px; border-bottom:1px solid var(--line); }
    .run-title { font-weight:770; }
    .person-line { display:grid; grid-template-columns:minmax(180px,1.1fr) minmax(150px,.9fr) minmax(150px,.9fr) auto; gap:16px; align-items:center; min-height:70px; padding:12px 5px; border-bottom:1px solid var(--line); }
    .event-line { display:grid; grid-template-columns:66px 12px minmax(0,1fr); gap:11px; padding:11px 0; }
    .event-time { color:var(--quiet); font:.69rem ui-monospace,monospace; }
    .event-dot { width:8px; height:8px; margin-top:5px; border-radius:50%; background:var(--accent); }
    .event-title { font-size:.82rem; font-weight:730; }
    .event-note { margin-top:3px; color:var(--muted); font-size:.75rem; }
    .health-line { display:grid; grid-template-columns:minmax(190px,1.2fr) 150px minmax(190px,1fr) 120px auto; gap:18px; align-items:center; min-height:72px; padding:12px 5px; border-bottom:1px solid var(--line); }
    .health-name { font-weight:770; }

    .gate-list { position:relative; margin:0; padding:0; list-style:none; }
    .gate-list::before { content:""; position:absolute; top:14px; bottom:14px; left:13px; width:2px; background:var(--line); }
    .gate { position:relative; display:grid; grid-template-columns:28px minmax(0,1fr); gap:15px; padding:0 0 26px; }
    .gate:last-child { padding-bottom:0; }
    .gate-dot { z-index:1; display:grid; place-items:center; width:28px; height:28px; border:2px solid var(--line); border-radius:50%; background:var(--surface); color:var(--muted); font-size:.68rem; font-weight:900; }
    .gate-dot.pass { border-color:var(--good); color:var(--good); }
    .gate-dot.block { border-color:var(--bad); color:var(--bad); }
    .gate-dot.wait { border-color:var(--warn); color:var(--warn); }
    .gate-copy { padding-top:2px; }
    .gate-name { font-weight:790; }
    .gate-state { margin-left:7px; color:var(--muted); font-size:.75rem; font-weight:700; }
    .gate-note { margin-top:5px; color:var(--muted); font-size:.8rem; line-height:1.45; }
    .gate-meta { margin-top:7px; color:var(--quiet); font-size:.71rem; }
    .gate-actions { margin-top:11px; }

    .prototype-tools { position:fixed; z-index:70; left:50%; bottom:12px; display:flex; align-items:center; gap:12px; min-height:48px; padding:6px 10px; transform:translateX(-50%); border:1px solid rgb(120 120 120 / 34%); border-radius:10px; background:color-mix(in srgb,var(--surface) 94%,transparent); box-shadow:0 10px 32px rgb(0 0 0 / 14%); backdrop-filter:blur(12px); white-space:nowrap; }
    .prototype-tools a { color:var(--muted); font-size:.69rem; text-decoration:underline; }
    .prototype-tools select { min-height:38px; padding:3px 25px 3px 8px; border:0; border-radius:6px; background:color-mix(in srgb,var(--text) 7%,var(--surface)); color:var(--text); font-size:.71rem; }
    .prototype-switcher { position:fixed; z-index:80; left:50%; bottom:13px; display:grid; grid-template-columns:44px minmax(190px,auto) 44px; align-items:center; transform:translateX(-50%); overflow:hidden; border:1px solid #737a7d; border-radius:999px; background:#080b0d; color:#f5f7f7; box-shadow:0 17px 46px rgb(0 0 0 / 34%); }
    .prototype-switcher button { min-height:44px; border:0; background:transparent; color:inherit; cursor:pointer; }
    .prototype-switcher button:hover { background:#242a2d; }
    .switch-label { padding:0 13px; color:#aeb5b7; font-size:.72rem; text-align:center; white-space:nowrap; }
    .switch-label strong { color:#fff; }

    dialog { width:min(700px,calc(100vw - 22px)); max-height:min(88vh,850px); padding:0; overflow:hidden; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--text); box-shadow:0 28px 90px rgb(0 0 0 / 38%); }
    dialog::backdrop { background:rgb(4 7 8 / 68%); backdrop-filter:blur(3px); }
    .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:20px 22px 15px; border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:3px 0 0; font-size:1.35rem; }
    .dialog-body { max-height:calc(88vh - 150px); overflow:auto; padding:20px 22px; }
    .dialog-foot { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:14px 22px; border-top:1px solid var(--line); background:color-mix(in srgb,var(--text) 3%,var(--surface)); }
    .dialog-section { padding:14px 0; border-bottom:1px solid var(--line); }
    .field { display:grid; gap:7px; margin-top:15px; font-size:.8rem; font-weight:720; }
    .field textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); font-weight:450; }
    .check { display:flex; align-items:flex-start; gap:9px; margin-top:14px; color:var(--muted); font-size:.79rem; line-height:1.4; }
    .check input { width:18px; height:18px; }
    .payload { overflow:auto; margin-top:10px; padding:11px; border-radius:7px; background:color-mix(in srgb,var(--text) 8%,var(--surface)); font-size:.72rem; line-height:1.5; white-space:pre-wrap; }
    .form-error { margin-top:10px; color:var(--bad); font-size:.8rem; font-weight:700; }
    .receipt { margin-top:16px; padding:14px; border-left:4px solid var(--good); background:color-mix(in srgb,var(--good) 9%,var(--surface)); font-size:.8rem; }
    .receipt.pending { border-color:var(--warn); background:color-mix(in srgb,var(--warn) 9%,var(--surface)); }
    .drawer { position:fixed; z-index:65; top:0; right:0; width:min(470px,100vw); height:100vh; overflow:auto; padding:26px; border-left:1px solid var(--line); background:var(--surface); color:var(--text); box-shadow:-18px 0 55px rgb(0 0 0 / 20%); }
    .drawer[hidden] { display:none; }
    .drawer-head { display:flex; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .drawer h2 { font-size:1.5rem; }

    /* E1 — Explorer Tree */
    body.v-E1 { --bg:#e8e5dc; --surface:#f7f4eb; --surface-2:#d9d5ca; --text:#171a1b; --muted:#626867; --quiet:#858a87; --line:#bcbcb5; --accent:#174f57; --accent-2:#10383d; color-scheme:light; }
    .t-shell { display:grid; grid-template-columns:278px minmax(0,1fr); min-height:100vh; padding-bottom:78px; }
    .t-tree { position:sticky; top:0; height:100vh; overflow:auto; padding:26px 18px; border-right:1px solid var(--line); background:#dcd8ce; }
    .t-brand { margin:0 8px 26px; font:850 .79rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .t-tree .global-nav { display:grid; gap:3px; }
    .t-tree .global-nav a { justify-content:space-between; }
    .t-tree-label { margin:28px 10px 11px; color:var(--quiet); font-size:.67rem; font-weight:820; letter-spacing:.1em; text-transform:uppercase; }
    .tree-list,.tree-list ul { margin:0; padding:0; list-style:none; }
    .tree-list { position:relative; }
    .tree-list::before { content:""; position:absolute; top:14px; bottom:18px; left:13px; width:2px; background:var(--text); }
    .tree-project { position:relative; margin-bottom:7px; padding-left:31px; }
    .tree-project::before { content:""; position:absolute; top:18px; left:8px; width:12px; height:12px; border:3px solid #dcd8ce; border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--text); }
    .tree-project.selected::before { background:#e0ab34; }
    .tree-project>a { display:block; min-height:44px; padding:8px 9px; border-radius:7px; color:var(--muted); font-size:.79rem; }
    .tree-project>a:hover,.tree-project>a[aria-current="page"] { background:var(--surface); color:var(--text); }
    .tree-project small { display:block; margin-top:2px; color:var(--quiet); }
    .tree-runs { position:relative; margin:3px 0 10px 15px!important; padding-left:21px!important; }
    .tree-runs::before { content:""; position:absolute; top:-4px; bottom:19px; left:0; width:1px; background:var(--text); }
    .tree-runs li { position:relative; }
    .tree-runs li::before { content:""; position:absolute; top:17px; left:-20px; width:14px; height:1px; background:var(--text); }
    .tree-runs a { display:block; min-height:40px; padding:7px 8px; border-radius:6px; color:var(--muted); font: .7rem ui-monospace,monospace; }
    .tree-runs a:hover,.tree-runs a[aria-current="page"] { background:var(--surface); color:var(--text); }
    .t-main { min-width:0; padding:55px clamp(22px,5vw,78px) 110px; }
    .t-content { max-width:1240px; margin:auto; }
    .t-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:30px; align-items:end; }
    .t-head-meta { max-width:280px; color:var(--muted); font-size:.77rem; line-height:1.5; }
    .t-overview { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(260px,.7fr); gap:clamp(30px,5vw,65px); }
    .t-section { margin-top:36px; }
    .t-run-layout { display:grid; grid-template-columns:minmax(300px,1.25fr) minmax(260px,.65fr); gap:clamp(34px,6vw,80px); }
    .t-facts { align-self:start; padding:18px 20px; border-radius:9px; background:var(--surface); box-shadow:0 4px 22px rgb(22 26 27 / 7%); }
    .fact { display:grid; grid-template-columns:105px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.78rem; }
    .fact:last-child { border-bottom:0; }

    /* E2 — Fold-out Spine */
    body.v-E2 { --bg:#eef0ea; --surface:#fbfcf8; --surface-2:#dce3dc; --text:#17201c; --muted:#64716b; --quiet:#87948d; --line:#c4ccc6; --accent:#39624e; --accent-2:#254737; color-scheme:light; }
    .s-shell { min-height:100vh; padding-bottom:80px; }
    .s-top { position:sticky; z-index:20; top:0; display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:64px; padding:10px clamp(18px,4vw,54px); border-bottom:1px solid var(--line); background:rgb(238 240 234 / 94%); backdrop-filter:blur(13px); }
    .s-brand { font:850 .76rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .s-main { max-width:1450px; margin:auto; padding:52px clamp(18px,5vw,72px) 110px; }
    .s-spine-canvas { position:relative; margin-top:38px; padding-left:42px; }
    .s-spine-canvas::before { content:""; position:absolute; top:10px; bottom:12px; left:14px; width:3px; background:var(--text); }
    .s-project-branch { position:relative; display:grid; grid-template-columns:minmax(190px,.62fr) minmax(300px,1.38fr); gap:28px; min-height:138px; padding:0 0 34px; }
    .s-project-branch::before { content:""; position:absolute; top:17px; left:-34px; width:17px; height:17px; border:4px solid var(--bg); border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--text); }
    .s-project-branch.selected::before { background:#d8a331; }
    .s-branch-name { padding-top:5px; }
    .s-branch-name a { font-size:1.08rem; font-weight:810; }
    .s-branch-panel { padding:20px 22px; border-left:3px solid var(--text); border-radius:0 10px 10px 0; background:var(--surface); }
    .s-context { display:grid; grid-template-columns:minmax(250px,.63fr) minmax(0,1.37fr); gap:clamp(34px,6vw,86px); margin-top:40px; }
    .s-context-spine { position:relative; align-self:start; padding-left:35px; }
    .s-context-spine::before { content:""; position:absolute; top:8px; bottom:8px; left:10px; width:2px; background:var(--text); }
    .s-context-node { position:relative; display:block; min-height:54px; padding:9px 11px; border-radius:7px; color:var(--muted); }
    .s-context-node::before { content:""; position:absolute; top:17px; left:-30px; width:12px; height:12px; border:3px solid var(--bg); border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--text); }
    .s-context-node.active { background:var(--surface); color:var(--text); }
    .s-context-node.active::before { background:#d8a331; }
    .s-context-runs { margin:7px 0 18px 18px; padding:0 0 0 17px; border-left:1px solid var(--text); list-style:none; }
    .s-context-runs a { display:block; min-height:42px; padding:8px; color:var(--muted); font:.7rem ui-monospace,monospace; }
    .s-context-runs a[aria-current="page"] { color:var(--text); font-weight:800; }
    .s-flow { display:grid; grid-template-columns:repeat(5,minmax(145px,1fr)); overflow:auto; margin-top:30px; border-block:3px solid var(--text); }
    .s-flow-step { position:relative; min-height:215px; padding:24px 17px; border-right:1px solid var(--line); background:var(--surface); }
    .s-flow-step::after { content:""; position:absolute; z-index:2; top:50%; right:-13px; width:25px; height:2px; background:var(--text); }
    .s-flow-step:last-child::after { display:none; }
    .s-ordinal { color:var(--quiet); font:850 1.8rem ui-monospace,monospace; }

    /* E3 — Dual Rail */
    body.v-E3 { --bg:#101416; --surface:#181e21; --surface-2:#252d31; --text:#eef2ef; --muted:#a0aaa6; --quiet:#717c78; --line:#343d3d; --accent:#71cfbd; --accent-2:#a7eee0; --good:#6bd09b; --warn:#e3b75e; --bad:#ef7d78; --unknown:#a799bd; --focus:#b4dcff; color-scheme:dark; }
    .r-shell { min-height:100vh; padding-bottom:82px; background-image:linear-gradient(to bottom,transparent 0 97%,rgb(255 255 255 / 2.5%) 97%); background-size:100% 38px; }
    .r-head { position:sticky; z-index:20; top:0; padding:14px clamp(18px,4vw,55px) 13px; border-bottom:1px solid var(--line); background:rgb(16 20 22 / 94%); backdrop-filter:blur(14px); }
    .r-global-row { display:flex; align-items:center; justify-content:space-between; gap:26px; }
    .r-brand { font:850 .75rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .r-global { display:flex; gap:5px; }
    .r-global a { display:flex; align-items:center; min-height:44px; padding:8px 13px; border-bottom:3px solid transparent; color:var(--muted); font-size:.78rem; font-weight:730; }
    .r-global a:hover,.r-global a[aria-current="page"] { color:var(--text); border-color:var(--accent); }

<body>
  <div id="app"></div>

  <aside id="drawer" class="drawer" hidden aria-labelledby="drawer-title">
    <div class="drawer-head"><div><div class="caps">Detail</div><h2 id="drawer-title" tabindex="-1">Detail</h2></div><button class="btn ghost" data-close-drawer>Close</button></div>
    <div id="drawer-body"></div>
  </aside>

  <dialog id="item-dialog" aria-labelledby="item-title">
    <div class="dialog-head"><div><div class="caps">Needs your attention</div><h2 id="item-title" tabindex="-1">Inbox item</h2></div><button class="btn ghost" data-close-item>Close</button></div>
    <div class="dialog-body" id="item-body"></div>
    <div class="dialog-foot" id="item-actions"></div>
  </dialog>

  <script type="application/json" id="manager-data"></script>

  <script>
    // Read-only consumer. No fabricated fixtures, remote requests, or workflow commands.
    const variants = {C: "Field Notes · Light", D: "Field Notes · Dark"};
    const pages = ["projects", "inbox", "health", "project", "room", "run"];
    const emptyDocument = {schema_version: 1, generated_at: null, rooms: []};
    let live = emptyDocument, lastTrigger = null;
    const own = (object, key) => Object.prototype.hasOwnProperty.call(object || {}, key);
    const text = value => value === null || value === undefined ? "unknown" : String(value);
    const esc = value => text(value).replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]));
    const object = value => !!value && typeof value === "object" && !Array.isArray(value);
    function getParam(name, fallback = "") { return new URLSearchParams(location.search).get(name) || fallback; }
    function variant() { return own(variants, getParam("variant")) ? getParam("variant") : "C"; }
    function page() { return pages.includes(getParam("page")) ? getParam("page") : "projects"; }
    function href(next, project = "", run = "") {
      const url = new URL(location.href);
      url.search = new URLSearchParams({variant: variant(), page: next}).toString();
      if (project) url.searchParams.set("project", project);
      if (run) url.searchParams.set("run", run);
      return esc(url.href);
    }
    function tone(value) {
      // Exact labels, never substring matching: disconnected is not connected.
      const label = text(value).toLowerCase();
      if (["disconnected", "failed", "unavailable", "unknown_outcome"].includes(label)) return "bad";
      if (["stale", "partial", "partial_mutation", "drift", "drifted", "catching-up"].includes(label)) return "warn";
      if (["current", "pass", "passed", "connected"].includes(label)) return "good";
      return "unknown";
    }
    function status(value) { return `<span class="status ${tone(value)}" data-status="${esc(value)}">${esc(value)}</span>`; }
    function missing() { return {source_owner: "unknown", observed_version: null, observed_at: null, source_committed_at: null, status: "unavailable", freshness: "unknown", reason: "SOURCE_NOT_CONNECTED", value: null}; }
    function fact(project, section) { return project?.view?.projection?.sections?.[section] || missing(); }
    function rows(project, section) { const source = fact(project, section); return source.status === "known" && object(source.value) ? Object.entries(source.value) : []; }
    function row(project, section, key) { const source = fact(project, section); return source.status === "known" && own(source.value, key) ? source.value[key] : null; }
    function stale(project) {
      const now = Date.now(), until = Date.parse(project.valid_until), captured = Date.parse(project.view.projection?.captured_at);
      return project.view.status !== "connected" || project.view.projection_stale === true || project.view.catching_up === true || !Number.isFinite(until) || now > until || now < captured;
    }
    function quality(project, source) { return stale(project) ? "stale" : source.freshness; }
    function sourceLine(project, section) {
      const source = fact(project, section);
      return `<p class="truth"><strong>${esc(source.source_owner)}</strong> · version ${esc(source.observed_version)} · source ${status(source.status)} · data ${status(quality(project, source))}<br>Observed ${esc(source.observed_at)} · committed ${esc(source.source_committed_at)}${source.reason ? `<br>Reason: ${esc(source.reason)}` : ""}</p>`;
    }
    function fields(value) {
      if (!object(value)) return `<p class="muted">unknown</p>`;
      return `<dl class="live-fields">${Object.entries(value).map(([key, value]) => `<div><dt>${esc(key.replaceAll("_", " "))}</dt><dd>${object(value) ? fields(value) : esc(value)}</dd></div>`).join("")}</dl>`;
    }
    function sectionDetails(project, section, selection = null, open = false) {
      const source = fact(project, section), values = rows(project, section).filter(([key, value]) => !selection || selection(key, value));
      return `<details ${open ? "open" : ""}><summary>${esc(section.replaceAll("_", " "))} · ${esc(source.status)} / ${esc(quality(project, source))}</summary><div>${sourceLine(project, section)}${values.map(([key, value]) => `<h3 class="mono">${esc(key)}</h3>${fields(value)}`).join("") || `<p>${source.status === "known" ? "No rows recorded in this source cut." : "No observation available; not a healthy or empty result."}</p>`}</div></details>`;
    }
    function projectKey(item) { return [item.view.identity.deployment_id, item.view.identity.room_id, item.view.identity.stream_id].map(encodeURIComponent).join("/"); }
    function stateFor(projectKeyValue = getParam("project"), runId = getParam("run")) {
      const projects = live.rooms.map(item => ({...item, key: projectKey(item), name: item.metadata.project_id}));
      const project = projects.find(item => item.key === projectKeyValue) || null;
      const run = project ? row(project, "runs", runId) : null;
      const attention = projects.flatMap(item => rows(item, "attention").filter(([, observation]) => observation.review_state === "ATTENTION" || observation.coordinator_attention === true || observation.status === "PAUSED").map(([id, observation]) => ({key: item.key + ":" + id, project: item, runId: id, observation, title: observation.review_reason || observation.control_reason || "Human attention recorded", quality: quality(item, fact(item, "attention")), current: quality(item, fact(item, "attention")) === "current"})));
      for (const item of projects) for (const [id, review] of rows(item, "review")) {
        if (review.state === "READY_FOR_HUMAN" && !attention.some(entry => entry.project.key === item.key && entry.runId === id)) attention.push({key: item.key + ":" + id, project: item, runId: id, observation: {review_state: review.state}, title: "Review stage: READY_FOR_HUMAN", quality: quality(item, fact(item, "review")), current: quality(item, fact(item, "review")) === "current", source: "review"});
      }
      attention.sort((a, b) => Number(b.current) - Number(a.current) || a.key.localeCompare(b.key));
      return {projects, project, run, runId, attention};
    }
    function currentDecision(state) {
      const attention = state.attention.filter(item => !state.project || item.project.key === state.project.key).filter(item => !state.run || item.runId === state.runId);
      const item = attention[0];
      return item ? `<div class="folio-alert" role="status"><strong>${item.current ? "NEEDS YOU" : "LAST OBSERVED ATTENTION"}</strong><button class="btn ghost" data-attention="${esc(item.key)}">${esc(item.title)}</button><a class="text-link" href="${href("inbox")}" data-nav>Inbox ${state.attention.length}</a></div>` : "";
    }
    function snapshot(project) {
      const view = project.view, captured = view.projection?.captured_at;
      return `<div class="snapshot ${stale(project) ? "" : "live-current"}" role="status"><strong>${status(view.status)} ${view.catching_up ? status("catching-up") : ""} ${status(stale(project) ? "stale" : "current")}</strong><br>${view.projection ? `Last complete Hub cut ${esc(view.projection.room_seq)} · captured ${esc(captured)}.` : "No accepted snapshot available."} Source observation freshness is separate. Controls remain disabled.</div>`;
    }
    function signals(project) {
      const values = new Set();
      for (const section of ["forge_diagnostics", "lifecycle_label_drift", "image_profile_drift", "provider_configuration", "inference"]) {
        const source = fact(project, section);
        if (source.status !== "known") values.add(source.status);
        for (const [, item] of rows(project, section)) {
          for (const key of ["state", "completeness", "observed_completeness", "validity"]) if (item[key] != null) values.add(item[key]);
        }
      }
      return [...values].map(status).join(" ") || status("unknown");
    }
    function controls(scope = "run") { return `<div class="action-line"><button class="btn" disabled aria-describedby="action-boundary-${scope}">Request changes</button><button class="btn" disabled aria-describedby="action-boundary-${scope}">Pause Run</button></div><p id="action-boundary-${scope}" class="small muted">Preview only — typed action eligibility and authenticated human requests are not connected (#77). No command is sent.</p>`; }
    function navigation(state) {
      const p = page();
      return `<header class="s-top"><div class="s-brand">Manager / ${esc(variants[variant()])}</div><nav class="global-nav" aria-label="Global areas">${["projects", "inbox", "health"].map(target => `<a href="${href(target)}" data-nav ${target === p || target === "projects" && ["project", "room", "run"].includes(p) ? 'aria-current="page"' : ""}>${target[0].toUpperCase() + target.slice(1)}</a>`).join("")}</nav></header><div class="s-frame"><aside class="s-project-index"><div class="s-index-head"><strong>Projects</strong></div><nav aria-label="Project and Run hierarchy"><ul class="s-project-tree">${state.projects.map(project => `<li class="s-project-item ${project.key === state.project?.key ? "selected" : ""}"><span class="s-project-dot" aria-hidden="true"></span><a class="s-project-link" href="${href("project", project.key)}" data-nav ${project.key === state.project?.key && p === "project" ? 'aria-current="page"' : ""}><strong>${esc(project.name)}</strong><small>${esc(project.view.status)}</small></a>${project.key === state.project?.key ? `<ul class="s-index-runs">${rows(project, "runs").map(([id, run]) => `<li><a href="${href("run", project.key, id)}" data-nav ${state.runId === id && p === "run" ? 'aria-current="page"' : ""}>${esc(id)}<br><small>${esc(run.status)}</small></a></li>`).join("")}</ul>` : ""}</li>`).join("")}</ul></nav></aside>`;
    }
    function folioHead(index, title, lede) { return `<header class="folio-heading"><div class="folio-index">${index}</div><h1 tabindex="-1">${esc(title)}</h1><p>${esc(lede)}</p></header>`; }
    function trail(state) { return `<nav class="s-breadcrumb" aria-label="Breadcrumb"><a href="${href("projects")}" data-nav>Projects</a><span>/</span><a href="${href("project", state.project.key)}" data-nav>${esc(state.project.name)}</a>${state.run ? `<span>/</span><span aria-current="page">${esc(state.runId)}</span>` : ""}${page() === "room" ? '<span>/</span><span aria-current="page">Room</span>' : ""}</nav>`; }
    function runLinks(project) {
      const source = fact(project, "runs");
      return rows(project, "runs").map(([id, run]) => `<article class="folio-run-card"><div><a class="run-title text-link" href="${href("run", project.key, id)}" data-nav>${esc(id)}</a><div class="sub">Issue ${esc(run.issue_number)} · generation ${esc(run.generation)}</div></div>${status(run.status)}<a class="btn" href="${href("run", project.key, id)}" data-nav>Open Run</a></article>`).join("") || `<p class="empty">${source.status === "known" ? "No Runs recorded." : "Runs unavailable — not evidence of an idle Room."}</p>`;
    }
    function participants(project) {
      return rows(project, "seats").map(([id, seat]) => `<button class="folio-person" data-person="${esc(id)}" data-project="${esc(project.key)}"><span class="folio-person-head"><span class="avatar" aria-hidden="true">${esc(id.slice(0, 2))}</span><span><strong>${esc(id)}</strong><span class="sub">${esc(seat.runtime)} · Actor ${esc(seat.actor_id)}</span></span></span><span class="small">Persisted process: ${status(row(project, "processes", id)?.state || "unknown")}<br>Recorded readiness: ${status(row(project, "readiness", id)?.readiness || "unknown")}</span></button>`).join("") || `<p class="empty">Seat observations ${esc(fact(project, "seats").status)}.</p>`;
    }
    function runJourney(state) {
      const source = fact(state.project, "journey"), window = source.value;
      const events = source.status === "known" ? Object.values(window.events).filter(item => item.run_id === state.runId).sort((a, b) => a.observed_version - b.observed_version) : [];
      return `<section class="run-journey" aria-labelledby="run-journey-title"><div class="run-journey-head"><h2 id="run-journey-title">Run journey</h2><span class="small muted">Chronological source observations · separate from Gate truth</span></div><p class="small muted">${window ? `${esc(window.completeness)} · Room sequence ${esc(window.from_seq)}–${esc(window.through_seq)}. Only named Run/Review owner events are shown; omitted event kinds are not absence of activity.` : "History unavailable — this source did not capture versioned Run history."}</p><div class="run-journey-scroll"><ol class="run-journey-track">${events.map(event => `<li class="journey-step ${event.kind === "review.result" && event.verdict === "changes-requested" ? "feedback" : ""}"><span class="journey-return">↩ CHANGES REQUESTED</span><span class="journey-dot" aria-hidden="true">·</span><span class="journey-copy"><span class="journey-phase">${esc(event.kind)}</span><span class="journey-detail">${esc(event.observed_at)} · Room sequence ${esc(event.observed_version)} · generation ${esc(event.generation)}${event.stage ? `<br>${esc(event.stage)}` : ""}${event.verdict ? `<br>${esc(event.verdict)}` : ""}</span></span></li>`).join("")}</ol>${events.length ? "" : '<p class="empty">No Run-attributed chronological observation available. No lifecycle steps inferred.</p>'}</div>${sourceLine(state.project, "journey")}</section>`;
    }
    function gates(state) { return rows(state.project, "gate_truth").filter(([, gate]) => gate.run_id === state.runId); }
    function gateState(project, source, gate) { return stale(project) || source.freshness === "stale" ? "stale" : gate.state || "unknown"; }
    function gateList(state) {
      const source = fact(state.project, "gate_truth");
      return `<div class="gate-ledger">${gates(state).map(([key, gate], index) => `<button class="gate-ledger-row" data-gate-index="${index}" data-project="${esc(state.project.key)}" data-run="${esc(state.runId)}" aria-label="Open ${esc(gate.gate_id || key)} details"><span class="gate-ledger-code">G${index + 1}</span><span class="gate-ledger-copy"><strong>${esc(gate.gate_id || key)}</strong><small>${esc(gate.reason)} · observed ${esc(gate.observed_state)}</small></span><span class="gate-ledger-state">${status(gateState(state.project, source, gate))}</span><span aria-hidden="true">›</span></button>`).join("") || `<p class="empty">Gate truth ${esc(source.status)}. Historical results cannot establish a current pass.</p>`}</div>${sourceLine(state.project, "gate_truth")}`;
    }
    function githubLink(project, runId) {
      const run = row(project, "runs", runId), candidate = row(project, "candidate", runId);
      const repository = project.metadata.repository;
      if (!run || run.repository !== repository || !/^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9_.-]{1,100}$/.test(repository) || !Number.isSafeInteger(candidate?.pull_number) || candidate.pull_number < 1) return '<p class="small muted">Canonical GitHub target unavailable.</p>';
      return `<a class="btn primary" href="https://github.com/${esc(repository)}/pull/${candidate.pull_number}" target="_blank" rel="noopener noreferrer">Open in GitHub</a><p class="small muted">Navigation only; opening GitHub neither approves nor completes this Run.</p>`;
    }
    function projectBody(state, roomOnly = false) {
      const project = state.project;
      if (roomOnly) return `${sectionDetails(project, "room_lifecycle", null, true)}${["image_profile_drift", "checkout_slots", "capabilities", "processes", "adapter_connections", "readiness", "context_binding", "last_observation"].map(section => sectionDetails(project, section)).join("")}`;
      return `<div class="folio-project-layout"><div><section class="folio-section"><h2>Runs</h2>${runLinks(project)}</section><section class="folio-section"><h2>Participants</h2><p class="small muted">Persisted process authority, adapter attachment, and readiness are independent observations.</p><div class="folio-people">${participants(project)}</div></section></div><aside class="folio-side-note"><h2>Project note</h2>${signals(project)}<p class="small">Room ${esc(project.view.identity.room_id)} · Deployment ${esc(project.view.identity.deployment_id)}</p><a class="btn" href="${href("room", project.key)}" data-nav>Room details</a><button class="btn ghost" data-project-detail="${esc(project.key)}">Source and binding</button><button class="btn ghost" data-health-project="${esc(project.key)}">Health details</button></aside></div>`;
    }
    function cases(state) { return `<div class="folio-case-list">${state.attention.map(item => `<button class="folio-case" data-attention="${esc(item.key)}"><span class="folio-case-code">${esc(item.quality.toUpperCase())}</span><span><strong>${esc(item.title)}</strong><span class="attention-summary">${esc(item.project.name)} · ${esc(item.runId)}</span></span><span>${status(item.quality)}</span></button>`).join("") || '<p class="empty">No human-attention rows recorded in available snapshots. Unavailable sources do not establish absence.</p>'}</div>`; }
    function render(focus = false) {
      const state = stateFor(), p = page(); let content;
      if (p === "projects") content = `${folioHead("P", "Project field notes", "Projects lead; Runs remain beneath their Project. All facts retain their own source and time.")}${currentDecision(state)}<div class="folio-projects">${state.projects.map((project, index) => `<article class="folio-project-card ${index === 0 ? "feature" : ""}"><div class="folio-card-number">${index + 1}</div><h2><a class="text-link" href="${href("project", project.key)}" data-nav>${esc(project.name)}</a></h2>${snapshot(project)}${signals(project)}<div class="folio-card-actions"><a class="btn primary" href="${href("project", project.key)}" data-nav>Open Project</a><button class="btn ghost" data-project-detail="${esc(project.key)}">Quick view</button></div></article>`).join("") || '<p class="empty">Disconnected — no authorized Room snapshots supplied.</p>'}</div>`;
      else if (p === "inbox") content = `${folioHead("I", "Attention casebook", "Source-recorded human attention, with context and evidence. Controls are previews only.")}${currentDecision(state)}${cases(state)}`;
      else if (p === "health") content = `${folioHead("H", "Runtime field checks", "Connection, freshness, provider validity, inference, quota, partial outcomes and drift are separate facts.")}<div class="folio-health-grid">${state.projects.map(project => `<article class="folio-health-card"><h2>${esc(project.name)}</h2>${snapshot(project)}${signals(project)}<button class="btn" data-health-project="${esc(project.key)}">Open health sheet</button></article>`).join("")}</div>`;
      else if (!state.project) content = folioHead("P", "Choose a Project", "This context is not present in the authorized snapshot. Choose a Project from the index.");
      else if (p === "project" || p === "room") content = `${trail(state)}${folioHead(p === "room" ? "RM" : "P", p === "room" ? `${state.project.name} / Room` : state.project.name, "Runs and technical Room facts stay inside this Project context.")}${snapshot(state.project)}${currentDecision(state)}${projectBody(state, p === "room")}`;
      else if (!state.run) content = `${trail(state)}${folioHead("R", "Choose a Run", "This Run is not recorded beneath the selected Project.")}`;
      else content = `${trail(state)}${folioHead("R", state.runId, `Generation ${text(state.run.generation)} · issue ${text(state.run.issue_number)} · literal state ${text(state.run.status)}`)}${snapshot(state.project)}${currentDecision(state)}${runJourney(state)}<div class="folio-run-layout"><section><div class="folio-section-head"><h2>Gate ledger</h2><span class="small muted">Independent current truth, not lifecycle stages</span></div>${gateList(state)}</section><aside class="folio-side-note"><h2>Run note</h2>${status(state.run.status)}${fields({candidate: row(state.project, "candidate", state.runId)?.candidate_sha, review: row(state.project, "review", state.runId)?.verdict, review_stage: row(state.project, "review", state.runId)?.state})}${githubLink(state.project, state.runId)}${controls()}<button class="btn ghost" data-evidence="candidate">Candidate and evidence</button></aside></div>`;
      document.body.className = `v-${variant()}`;
      document.getElementById("app").innerHTML = `<div class="s-shell folio-shell">${navigation(state)}<main class="s-main"><div class="s-main-content">${content}</div></main></div></div><div class="prototype-tools"><nav class="prototype-variants" aria-label="Field Notes theme"><button data-variant="C" aria-pressed="${variant() === "C"}">Light</button><button data-variant="D" aria-pressed="${variant() === "D"}">Dark</button></nav></div>`;
      document.title = `${variants[variant()]} · ${p}`;
      if (focus) requestAnimationFrame(() => document.querySelector("main h1")?.focus());
    }
    function openDrawer(title, body) { closeItem(false); lastTrigger = document.activeElement; document.getElementById("drawer-title").textContent = title; document.getElementById("drawer-body").innerHTML = body; document.getElementById("drawer").hidden = false; requestAnimationFrame(() => document.getElementById("drawer-title").focus()); }
    function closeDrawer(restore = true) { document.getElementById("drawer").hidden = true; if (restore && lastTrigger?.isConnected) lastTrigger.focus(); }
    function closeItem(restore = true) { const dialog = document.getElementById("item-dialog"); if (dialog.open) dialog.close(); if (restore && lastTrigger?.isConnected) lastTrigger.focus(); }
    function projectDetail(key) { const {project} = stateFor(key); if (!project) return; openDrawer(project.name, `${snapshot(project)}<a class="btn" href="${href("project", key)}" data-nav>Open Project</a><h3>Configured Project binding</h3><p class="small">Configuration metadata; not a live process or provider observation.</p>${fields(project.metadata)}${sourceLine(project, "runs")}<a class="btn" href="${href("room", key)}" data-nav>Room details</a>`); }
    function personDetail(id, key = getParam("project")) { const {project} = stateFor(key); if (!project) return; openDrawer(id, `<p>Seat, persisted process, adapter attachment, readiness and inference do not imply each other. Capability declarations are not action eligibility.</p>${["seats", "processes", "adapter_connections", "readiness", "context_binding", "last_observation", "capabilities", "provider_configuration", "inference", "quota", "context_observations"].map(section => sectionDetails(project, section, (key, value) => key === id || value.participant_id === id)).join("")}`); }
    function healthProject(key) { const {project} = stateFor(key); if (!project) return; openDrawer(`${project.name} health`, `${snapshot(project)}<p>Interpretation: no connected socket, percentage or persisted authority proves healthy inference or process liveness. Pending CI is an owner checkpoint, not a remote run assertion.</p>${["room_lifecycle", "provider_configuration", "inference", "quota", "context_observations", "image_profile_drift", "lifecycle_label_drift", "forge_diagnostics", "pending_ci", "dependencies", "checkout_slots", "capabilities"].map(section => sectionDetails(project, section)).join("")}`); }
    function gateDetail(index, key, runId) { const state = stateFor(key, runId), entry = gates(state)[Number(index)]; if (!entry) return; const [id, gate] = entry; openDrawer(gate.gate_id || id, `${status(gateState(state.project, fact(state.project, "gate_truth"), gate))}<p>This is one independent check. The chronological Run journey cannot establish a Gate pass. Observed state remains historical until the owner confirms current truth.</p>${sourceLine(state.project, "gate_truth")}${fields(gate)}${sectionDetails(state.project, "gate_history", (_, value) => value.scope?.run_id === runId)}`); }
    function evidenceDetail() { const state = stateFor(); if (!state.project || !state.run) return; openDrawer("Candidate and evidence", `<p>Evidence references and immutable results are observations, not approval or merge authority. Raw logs are not fetched by this UI.</p>${["runs", "candidate", "review", "pending_ci", "work_requests", "dependencies"].map(section => sectionDetails(state.project, section, (key, value) => key === state.runId || value.run_id === state.runId)).join("")}${sectionDetails(state.project, "gate_history", (_, value) => value.scope?.run_id === state.runId)}${githubLink(state.project, state.runId)}`); }
    function openAttention(key) { const item = stateFor().attention.find(item => item.key === key); if (!item) return; closeDrawer(false); lastTrigger = document.activeElement; document.getElementById("item-title").textContent = item.title; document.getElementById("item-body").innerHTML = `${snapshot(item.project)}${sourceLine(item.project, item.source || "attention")}${fields(item.observation)}${sectionDetails(item.project, "review", id => id === item.runId)}${controls("attention")}`; document.getElementById("item-actions").innerHTML = `<button class="btn" data-close-item>Close</button><a class="btn" href="${href("run", item.project.key, item.runId)}" data-nav>Open Run</a>${githubLink(item.project, item.runId)}`; document.getElementById("item-dialog").showModal(); requestAnimationFrame(() => document.getElementById("item-title").focus()); }
    function installDocument(value) {
      if (!object(value) || value.schema_version !== 1 || !Array.isArray(value.rooms) || value.rooms.some(item => !object(item.metadata) || !object(item.view?.identity))) throw new Error("Unsupported Manager view");
      live = value; closeDrawer(false); closeItem(false); render();
    }
    document.addEventListener("click", event => {
      const target = event.target;
      const nav = target.closest("a[data-nav]"); if (nav) { event.preventDefault(); closeDrawer(false); closeItem(false); history.pushState({}, "", nav.href); render(true); return; }
      const theme = target.closest("[data-variant]"); if (theme) { const url = new URL(location.href); url.searchParams.set("variant", theme.dataset.variant); history.replaceState({}, "", url); render(); return; }
      const item = target.closest("[data-attention]"); if (item) return openAttention(item.dataset.attention);
      const gate = target.closest("[data-gate-index]"); if (gate) return gateDetail(gate.dataset.gateIndex, gate.dataset.project, gate.dataset.run);
      const project = target.closest("[data-project-detail]"); if (project) return projectDetail(project.dataset.projectDetail);
      const person = target.closest("[data-person]"); if (person) return personDetail(person.dataset.person, person.dataset.project);
      const health = target.closest("[data-health-project]"); if (health) return healthProject(health.dataset.healthProject);
      if (target.closest("[data-evidence]")) return evidenceDetail();
      if (target.closest("[data-close-drawer]")) return closeDrawer();
      if (target.closest("[data-close-item]")) return closeItem();
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && !document.getElementById("drawer").hidden) { event.preventDefault(); closeDrawer(); } });
    document.getElementById("item-dialog").addEventListener("cancel", event => { event.preventDefault(); closeItem(); });
    window.addEventListener("popstate", () => { closeDrawer(false); closeItem(false); render(true); });
    const bootstrap = document.getElementById("manager-data").textContent.trim();
    if (bootstrap) { try { installDocument(JSON.parse(bootstrap)); } catch (_) { document.getElementById("app").textContent = "Manager data unavailable — unsupported or invalid view. No actions are available."; } }
    else render();
    // A retained page must age out even if its authorized host stops refreshing.
    let lastStaleness = stateFor().projects.map(project => `${project.key}:${stale(project)}`).join("|");
    setInterval(() => {
      const marker = stateFor().projects.map(project => `${project.key}:${stale(project)}`).join("|");
      if (marker !== lastStaleness) { lastStaleness = marker; closeDrawer(false); closeItem(false); render(); }
    }, 1000);
  </script>
</body>
</html>
