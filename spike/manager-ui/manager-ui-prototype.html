<!doctype html>
<!-- PROTOTYPE — throwaway. Selected Field Notes direction in light and dark themes, switchable via ?variant=C|D. The Run page compares a chronological iteration journey with a compact, clickable ledger of independent gate truth. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manager prototype — Field Notes light/dark study</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#e9e7df;
      --surface:#f7f5ed;
      --surface-2:#ddd9cf;
      --text:#171a1b;
      --muted:#626969;
      --quiet:#858b89;
      --line:#babbb6;
      --accent:#1c5a61;
      --accent-2:#103c41;
      --good:#2f745b;
      --warn:#9d6610;
      --bad:#aa3832;
      --unknown:#685f79;
      --focus:#006bc7;
      --shadow:0 20px 60px rgb(18 22 22 / 18%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    * { box-sizing:border-box; }
    html { background:var(--bg); }
    body { margin:0; min-width:320px; background:var(--bg); color:var(--text); }
    button,input,textarea,select { font:inherit; }
    button,a,summary { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    a { color:inherit; text-decoration:none; }
    button { color:inherit; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:12px; font-size:clamp(2rem,5vw,5.2rem); line-height:.94; letter-spacing:-.055em; }
    h2 { margin-bottom:9px; font-size:1.08rem; letter-spacing:-.02em; }
    h3 { margin-bottom:6px; font-size:.9rem; }
    p { line-height:1.55; }
    ul { margin-top:8px; }
    .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .muted { color:var(--muted); }
    .quiet { color:var(--quiet); }
    .small { font-size:.81rem; }
    .tiny { font-size:.72rem; }
    .caps { color:var(--quiet); font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .row { display:flex; align-items:center; gap:9px; }
    .row.wrap { flex-wrap:wrap; }
    .row.between { justify-content:space-between; }
    .stack { display:grid; gap:12px; }
    .stack-lg { display:grid; gap:28px; }
    .divider { height:1px; background:var(--line); }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 13px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--text); cursor:pointer; font-size:.79rem; font-weight:720; }
    .btn:hover { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 6%,var(--surface)); }
    .btn.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
    .btn.danger { border-color:var(--bad); color:var(--bad); }
    .btn.ghost { border-color:transparent; background:transparent; }
    .btn:disabled { opacity:.48; cursor:not-allowed; }
    .text-link { color:var(--accent); font-weight:720; text-decoration:underline; text-underline-offset:4px; }
    .text-link:hover { text-decoration-thickness:2px; }
    .action-line { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .status { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:.76rem; font-weight:700; white-space:nowrap; }
    .status::before { content:""; width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--unknown); }
    .status.good::before { background:var(--good); }
    .status.warn::before { background:var(--warn); }
    .status.bad::before { background:var(--bad); }
    .status.unknown::before { background:var(--unknown); }
    .truth { color:var(--muted); font-size:.75rem; line-height:1.45; }
    .truth strong { color:var(--text); }
    .source { margin-left:5px; color:var(--quiet); font-size:.7rem; }
    .avatar { display:grid; place-items:center; flex:0 0 auto; width:36px; height:36px; border-radius:50%; background:color-mix(in srgb,var(--accent) 14%,var(--surface)); color:var(--accent-2); font-size:.72rem; font-weight:850; }
    .snapshot { margin:24px 0; padding:13px 15px; border-left:4px solid var(--bad); background:color-mix(in srgb,var(--bad) 8%,var(--surface)); font-size:.82rem; line-height:1.5; }
    .disabled-note { width:100%; color:var(--bad); font-size:.76rem; }
    .page-lede { max-width:760px; color:var(--muted); }
    .page-code { margin-bottom:9px; color:var(--accent); font:800 .71rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .page-rule { height:4px; margin:26px 0 34px; background:var(--text); }
    details { border-top:1px solid var(--line); }
    details:last-child { border-bottom:1px solid var(--line); }
    summary { min-height:44px; padding:12px 4px; cursor:pointer; font-size:.82rem; font-weight:720; }
    details>div { padding:2px 4px 15px; color:var(--muted); font-size:.81rem; line-height:1.5; }
    progress { width:100%; height:8px; accent-color:var(--accent); }
    .empty { padding:42px 12px; color:var(--muted); text-align:center; }

    .global-nav { display:flex; align-items:center; gap:4px; }
    .global-nav a { display:flex; align-items:center; min-height:44px; padding:8px 12px; border-radius:7px; color:var(--muted); font-size:.79rem; font-weight:720; }
    .global-nav a:hover { color:var(--text); background:color-mix(in srgb,var(--text) 5%,transparent); }
    .global-nav a[aria-current="page"] { color:var(--text); background:var(--surface-2); }
    .count { min-width:23px; margin-left:7px; padding:2px 6px; border-radius:999px; background:#dfb54b; color:#35280a; font-size:.66rem; text-align:center; }
    .project-line { display:grid; grid-template-columns:minmax(220px,1.4fr) minmax(190px,1fr) 110px 110px auto; gap:20px; align-items:center; min-height:82px; padding:14px 5px; border-bottom:1px solid var(--line); }
    .project-line.header { min-height:34px; color:var(--quiet); font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .project-name { font-size:.94rem; font-weight:790; }
    .sub { margin-top:4px; color:var(--muted); font-size:.74rem; }
    .attention-line { display:grid; grid-template-columns:16px minmax(0,1fr) auto; gap:13px; align-items:start; width:100%; min-height:72px; padding:15px 5px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; cursor:pointer; }
    .attention-line:hover { background:color-mix(in srgb,var(--accent) 5%,transparent); }
    .signal { width:10px; height:10px; margin-top:5px; border-radius:50%; background:var(--warn); }
    .attention-line.high .signal { background:var(--bad); }
    .attention-line.low .signal { background:var(--unknown); }
    .attention-title { font-size:.87rem; font-weight:770; }
    .attention-summary { display:block; margin-top:4px; color:var(--muted); font-size:.76rem; line-height:1.4; }
    .attention-age { color:var(--quiet); font-size:.72rem; white-space:nowrap; }
    .run-line { display:grid; grid-template-columns:minmax(220px,1.35fr) 130px 120px auto; gap:18px; align-items:center; min-height:76px; padding:13px 5px; border-bottom:1px solid var(--line); }
    .run-title { font-weight:770; }
    .person-line { display:grid; grid-template-columns:minmax(180px,1.1fr) minmax(150px,.9fr) minmax(150px,.9fr) auto; gap:16px; align-items:center; min-height:70px; padding:12px 5px; border-bottom:1px solid var(--line); }
    .event-line { display:grid; grid-template-columns:66px 12px minmax(0,1fr); gap:11px; padding:11px 0; }
    .event-time { color:var(--quiet); font:.69rem ui-monospace,monospace; }
    .event-dot { width:8px; height:8px; margin-top:5px; border-radius:50%; background:var(--accent); }
    .event-title { font-size:.82rem; font-weight:730; }
    .event-note { margin-top:3px; color:var(--muted); font-size:.75rem; }
    .health-line { display:grid; grid-template-columns:minmax(190px,1.2fr) 150px minmax(190px,1fr) 120px auto; gap:18px; align-items:center; min-height:72px; padding:12px 5px; border-bottom:1px solid var(--line); }
    .health-name { font-weight:770; }

    .gate-list { position:relative; margin:0; padding:0; list-style:none; }
    .gate-list::before { content:""; position:absolute; top:14px; bottom:14px; left:13px; width:2px; background:var(--line); }
    .gate { position:relative; display:grid; grid-template-columns:28px minmax(0,1fr); gap:15px; padding:0 0 26px; }
    .gate:last-child { padding-bottom:0; }
    .gate-dot { z-index:1; display:grid; place-items:center; width:28px; height:28px; border:2px solid var(--line); border-radius:50%; background:var(--surface); color:var(--muted); font-size:.68rem; font-weight:900; }
    .gate-dot.pass { border-color:var(--good); color:var(--good); }
    .gate-dot.block { border-color:var(--bad); color:var(--bad); }
    .gate-dot.wait { border-color:var(--warn); color:var(--warn); }
    .gate-copy { padding-top:2px; }
    .gate-name { font-weight:790; }
    .gate-state { margin-left:7px; color:var(--muted); font-size:.75rem; font-weight:700; }
    .gate-note { margin-top:5px; color:var(--muted); font-size:.8rem; line-height:1.45; }
    .gate-meta { margin-top:7px; color:var(--quiet); font-size:.71rem; }
    .gate-actions { margin-top:11px; }

    .prototype-tools { position:fixed; z-index:70; left:50%; bottom:12px; display:flex; align-items:center; gap:12px; min-height:48px; padding:6px 10px; transform:translateX(-50%); border:1px solid rgb(120 120 120 / 34%); border-radius:10px; background:color-mix(in srgb,var(--surface) 94%,transparent); box-shadow:0 10px 32px rgb(0 0 0 / 14%); backdrop-filter:blur(12px); white-space:nowrap; }
    .prototype-tools a { color:var(--muted); font-size:.69rem; text-decoration:underline; }
    .prototype-tools select { min-height:38px; padding:3px 25px 3px 8px; border:0; border-radius:6px; background:color-mix(in srgb,var(--text) 7%,var(--surface)); color:var(--text); font-size:.71rem; }
    .prototype-switcher { position:fixed; z-index:80; left:50%; bottom:13px; display:grid; grid-template-columns:44px minmax(190px,auto) 44px; align-items:center; transform:translateX(-50%); overflow:hidden; border:1px solid #737a7d; border-radius:999px; background:#080b0d; color:#f5f7f7; box-shadow:0 17px 46px rgb(0 0 0 / 34%); }
    .prototype-switcher button { min-height:44px; border:0; background:transparent; color:inherit; cursor:pointer; }
    .prototype-switcher button:hover { background:#242a2d; }
    .switch-label { padding:0 13px; color:#aeb5b7; font-size:.72rem; text-align:center; white-space:nowrap; }
    .switch-label strong { color:#fff; }

    dialog { width:min(700px,calc(100vw - 22px)); max-height:min(88vh,850px); padding:0; overflow:hidden; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--text); box-shadow:0 28px 90px rgb(0 0 0 / 38%); }
    dialog::backdrop { background:rgb(4 7 8 / 68%); backdrop-filter:blur(3px); }
    .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:20px 22px 15px; border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:3px 0 0; font-size:1.35rem; }
    .dialog-body { max-height:calc(88vh - 150px); overflow:auto; padding:20px 22px; }
    .dialog-foot { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:14px 22px; border-top:1px solid var(--line); background:color-mix(in srgb,var(--text) 3%,var(--surface)); }
    .dialog-section { padding:14px 0; border-bottom:1px solid var(--line); }
    .field { display:grid; gap:7px; margin-top:15px; font-size:.8rem; font-weight:720; }
    .field textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); font-weight:450; }
    .check { display:flex; align-items:flex-start; gap:9px; margin-top:14px; color:var(--muted); font-size:.79rem; line-height:1.4; }
    .check input { width:18px; height:18px; }
    .payload { overflow:auto; margin-top:10px; padding:11px; border-radius:7px; background:color-mix(in srgb,var(--text) 8%,var(--surface)); font-size:.72rem; line-height:1.5; white-space:pre-wrap; }
    .form-error { margin-top:10px; color:var(--bad); font-size:.8rem; font-weight:700; }
    .receipt { margin-top:16px; padding:14px; border-left:4px solid var(--good); background:color-mix(in srgb,var(--good) 9%,var(--surface)); font-size:.8rem; }
    .receipt.pending { border-color:var(--warn); background:color-mix(in srgb,var(--warn) 9%,var(--surface)); }
    .drawer { position:fixed; z-index:65; top:0; right:0; width:min(470px,100vw); height:100vh; overflow:auto; padding:26px; border-left:1px solid var(--line); background:var(--surface); color:var(--text); box-shadow:-18px 0 55px rgb(0 0 0 / 20%); }
    .drawer[hidden] { display:none; }
    .drawer-head { display:flex; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .drawer h2 { font-size:1.5rem; }

    /* E1 — Explorer Tree */
    body.v-E1 { --bg:#e8e5dc; --surface:#f7f4eb; --surface-2:#d9d5ca; --text:#171a1b; --muted:#626867; --quiet:#858a87; --line:#bcbcb5; --accent:#174f57; --accent-2:#10383d; color-scheme:light; }
    .t-shell { display:grid; grid-template-columns:278px minmax(0,1fr); min-height:100vh; padding-bottom:78px; }
    .t-tree { position:sticky; top:0; height:100vh; overflow:auto; padding:26px 18px; border-right:1px solid var(--line); background:#dcd8ce; }
    .t-brand { margin:0 8px 26px; font:850 .79rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .t-tree .global-nav { display:grid; gap:3px; }
    .t-tree .global-nav a { justify-content:space-between; }
    .t-tree-label { margin:28px 10px 11px; color:var(--quiet); font-size:.67rem; font-weight:820; letter-spacing:.1em; text-transform:uppercase; }
    .tree-list,.tree-list ul { margin:0; padding:0; list-style:none; }
    .tree-list { position:relative; }
    .tree-list::before { content:""; position:absolute; top:14px; bottom:18px; left:13px; width:2px; background:var(--text); }
    .tree-project { position:relative; margin-bottom:7px; padding-left:31px; }
    .tree-project::before { content:""; position:absolute; top:18px; left:8px; width:12px; height:12px; border:3px solid #dcd8ce; border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--text); }
    .tree-project.selected::before { background:#e0ab34; }
    .tree-project>a { display:block; min-height:44px; padding:8px 9px; border-radius:7px; color:var(--muted); font-size:.79rem; }
    .tree-project>a:hover,.tree-project>a[aria-current="page"] { background:var(--surface); color:var(--text); }
    .tree-project small { display:block; margin-top:2px; color:var(--quiet); }
    .tree-runs { position:relative; margin:3px 0 10px 15px!important; padding-left:21px!important; }
    .tree-runs::before { content:""; position:absolute; top:-4px; bottom:19px; left:0; width:1px; background:var(--text); }
    .tree-runs li { position:relative; }
    .tree-runs li::before { content:""; position:absolute; top:17px; left:-20px; width:14px; height:1px; background:var(--text); }
    .tree-runs a { display:block; min-height:40px; padding:7px 8px; border-radius:6px; color:var(--muted); font: .7rem ui-monospace,monospace; }
    .tree-runs a:hover,.tree-runs a[aria-current="page"] { background:var(--surface); color:var(--text); }
    .t-main { min-width:0; padding:55px clamp(22px,5vw,78px) 110px; }
    .t-content { max-width:1240px; margin:auto; }
    .t-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:30px; align-items:end; }
    .t-head-meta { max-width:280px; color:var(--muted); font-size:.77rem; line-height:1.5; }
    .t-overview { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(260px,.7fr); gap:clamp(30px,5vw,65px); }
    .t-section { margin-top:36px; }
    .t-run-layout { display:grid; grid-template-columns:minmax(300px,1.25fr) minmax(260px,.65fr); gap:clamp(34px,6vw,80px); }
    .t-facts { align-self:start; padding:18px 20px; border-radius:9px; background:var(--surface); box-shadow:0 4px 22px rgb(22 26 27 / 7%); }
    .fact { display:grid; grid-template-columns:105px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.78rem; }
    .fact:last-child { border-bottom:0; }

    /* E2 — Fold-out Spine */
    body.v-E2 { --bg:#eef0ea; --surface:#fbfcf8; --surface-2:#dce3dc; --text:#17201c; --muted:#64716b; --quiet:#87948d; --line:#c4ccc6; --accent:#39624e; --accent-2:#254737; color-scheme:light; }
    .s-shell { min-height:100vh; padding-bottom:80px; }
    .s-top { position:sticky; z-index:20; top:0; display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:64px; padding:10px clamp(18px,4vw,54px); border-bottom:1px solid var(--line); background:rgb(238 240 234 / 94%); backdrop-filter:blur(13px); }
    .s-brand { font:850 .76rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .s-main { max-width:1450px; margin:auto; padding:52px clamp(18px,5vw,72px) 110px; }
    .s-spine-canvas { position:relative; margin-top:38px; padding-left:42px; }
    .s-spine-canvas::before { content:""; position:absolute; top:10px; bottom:12px; left:14px; width:3px; background:var(--text); }
    .s-project-branch { position:relative; display:grid; grid-template-columns:minmax(190px,.62fr) minmax(300px,1.38fr); gap:28px; min-height:138px; padding:0 0 34px; }
    .s-project-branch::before { content:""; position:absolute; top:17px; left:-34px; width:17px; height:17px; border:4px solid var(--bg); border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--text); }
    .s-project-branch.selected::before { background:#d8a331; }
    .s-branch-name { padding-top:5px; }
    .s-branch-name a { font-size:1.08rem; font-weight:810; }
    .s-branch-panel { padding:20px 22px; border-left:3px solid var(--text); border-radius:0 10px 10px 0; background:var(--surface); }
    .s-context { display:grid; grid-template-columns:minmax(250px,.63fr) minmax(0,1.37fr); gap:clamp(34px,6vw,86px); margin-top:40px; }
    .s-context-spine { position:relative; align-self:start; padding-left:35px; }
    .s-context-spine::before { content:""; position:absolute; top:8px; bottom:8px; left:10px; width:2px; background:var(--text); }
    .s-context-node { position:relative; display:block; min-height:54px; padding:9px 11px; border-radius:7px; color:var(--muted); }
    .s-context-node::before { content:""; position:absolute; top:17px; left:-30px; width:12px; height:12px; border:3px solid var(--bg); border-radius:50%; background:var(--quiet); box-shadow:0 0 0 2px var(--text); }
    .s-context-node.active { background:var(--surface); color:var(--text); }
    .s-context-node.active::before { background:#d8a331; }
    .s-context-runs { margin:7px 0 18px 18px; padding:0 0 0 17px; border-left:1px solid var(--text); list-style:none; }
    .s-context-runs a { display:block; min-height:42px; padding:8px; color:var(--muted); font:.7rem ui-monospace,monospace; }
    .s-context-runs a[aria-current="page"] { color:var(--text); font-weight:800; }
    .s-flow { display:grid; grid-template-columns:repeat(5,minmax(145px,1fr)); overflow:auto; margin-top:30px; border-block:3px solid var(--text); }
    .s-flow-step { position:relative; min-height:215px; padding:24px 17px; border-right:1px solid var(--line); background:var(--surface); }
    .s-flow-step::after { content:""; position:absolute; z-index:2; top:50%; right:-13px; width:25px; height:2px; background:var(--text); }
    .s-flow-step:last-child::after { display:none; }
    .s-ordinal { color:var(--quiet); font:850 1.8rem ui-monospace,monospace; }

    /* E3 — Dual Rail */
    body.v-E3 { --bg:#101416; --surface:#181e21; --surface-2:#252d31; --text:#eef2ef; --muted:#a0aaa6; --quiet:#717c78; --line:#343d3d; --accent:#71cfbd; --accent-2:#a7eee0; --good:#6bd09b; --warn:#e3b75e; --bad:#ef7d78; --unknown:#a799bd; --focus:#b4dcff; color-scheme:dark; }
    .r-shell { min-height:100vh; padding-bottom:82px; background-image:linear-gradient(to bottom,transparent 0 97%,rgb(255 255 255 / 2.5%) 97%); background-size:100% 38px; }
    .r-head { position:sticky; z-index:20; top:0; padding:14px clamp(18px,4vw,55px) 13px; border-bottom:1px solid var(--line); background:rgb(16 20 22 / 94%); backdrop-filter:blur(14px); }
    .r-global-row { display:flex; align-items:center; justify-content:space-between; gap:26px; }
    .r-brand { font:850 .75rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .r-global { display:flex; gap:5px; }
    .r-global a { display:flex; align-items:center; min-height:44px; padding:8px 13px; border-bottom:3px solid transparent; color:var(--muted); font-size:.78rem; font-weight:730; }
    .r-global a:hover,.r-global a[aria-current="page"] { color:var(--text); border-color:var(--accent); }
    .r-context { display:flex; align-items:center; gap:0; min-height:49px; margin-top:9px; padding-top:8px; border-top:1px solid var(--line); overflow:auto; }
    .r-context-label { margin-right:18px; color:var(--quiet); font:.67rem ui-monospace,monospace; letter-spacing:.1em; }
    .r-context-node { position:relative; display:flex; align-items:center; gap:9px; min-height:38px; padding:5px 8px; color:var(--muted); font-size:.74rem; white-space:nowrap; }

    function walkDoors(state){ return `<div class="walk-corridor">${state.projects.map((project,index)=>`<section class="walk-door"><div class="walk-door-number">0${index+1}</div><h2><a class="text-link" href="${projectHref(project.key)}" data-nav>${project.name}</a></h2><p class="muted">${project.participants}</p><div class="stack"><span>${status(project.health)}</span><strong>${project.work}</strong><span class="small muted">${project.latest}</span></div><div class="walk-door-actions"><a class="btn primary" href="${projectHref(project.key)}" data-nav>Open Project</a><button class="btn ghost" data-project-detail="${project.key}">Quick view</button></div></section>`).join("")}</div>`; }
    function walkTracks(state){ return `<div class="walk-track-board"><div class="walk-track-row"><div class="walk-track-label"><strong>RUN TRACK</strong><div class="sub">current + recent</div></div><div class="walk-track-items">${state.project.runs.map(id=>{const run=state.runs[id];return `<a class="walk-step ${run.current?"current":"good"} text-link" href="${runHref(state.project.key,id)}" data-nav><strong>${run.title}</strong><br><small>${run.id} · ${run.state}</small></a>`;}).join("")}</div></div><div class="walk-track-row"><div class="walk-track-label"><strong>PEOPLE TRACK</strong><div class="sub">process / readiness</div></div><div class="walk-track-items">${state.people.map(person=>`<button class="walk-step ${tone(person.process)}" data-person="${person.id}"><strong>${person.name}</strong><br><small>${person.process}<br>${person.readiness}</small></button>`).join("")}</div></div><div class="walk-track-row"><div class="walk-track-label"><strong>ACTIVITY TRACK</strong><div class="sub">significant events</div></div><div class="walk-track-items">${state.events.slice(0,4).map(event=>`<span class="walk-step"><strong>${event.time}</strong><br><small>${event.title}</small></span>`).join("")}</div></div></div>`; }
    function walkGateCards(state){ return `<div class="walk-gate-grid">${variantGates(state).map((gate,index)=>`<article class="walk-gate ${gate.code}"><div class="walk-gate-code">G${String(index+1).padStart(2,"0")}</div><h2>${gate.name}</h2>${status(gate.state)}<p class="small muted" style="margin-top:13px">${gate.note}</p><div class="tiny quiet">${gate.source} · ${gate.observed}</div>${variantGateAction(gate,state)}</article>`).join("")}</div>`; }
    function walkHealth(state){ return `<div class="walk-health-grid">${state.projects.map(project=>`<article class="walk-health-card ${tone(project.health)}"><div class="walk-gate-code">${project.key.toUpperCase()}</div><h2 style="margin-top:28px">${project.name}</h2><p>${status(project.health)}</p><p class="muted small">Data ${project.freshness} · ${project.connection}<br>Observed ${project.observed}</p><button class="btn" data-health-project="${project.key}">Inspect components</button></article>`).join("")}</div>`; }
    function walkInbox(state){ return `<div class="walk-inbox">${state.attention.map((item,index)=>`<button class="walk-inbox-item" data-attention="${item.key}"><span class="walk-inbox-code">${item.level==="high"?"ACT":"MON"}-${String(index+1).padStart(2,"0")}</span><span><strong>${item.title}</strong><span class="attention-summary">${item.summary}</span></span><span class="small muted">${item.scope}<br>${item.age}</span></button>`).join("")}</div>`; }
    function renderB(state,p){
      let content="";
      if(p==="projects")content=`${walkHead("GLOBAL / PROJECTS","Project walkway","Open a Project doorway to enter its Runs, Participants, and significant activity.","Three Projects · two current Runs · hierarchy remains in the Project index")}${snapshot(state)}${walkTape(state)}${walkDoors(state)}`;
      if(p==="inbox")content=`${walkHead("GLOBAL / INBOX","Attention tape","Only human decisions, reconciliation, and actionable health incidents travel here.",`${state.attention.length} unresolved · ordinary Messages stay with their Project or Run`)}${snapshot(state)}${walkInbox(state)}`;
      if(p==="health")content=`${walkHead("GLOBAL / HEALTH","Health anatomy","Project runtime state and data quality remain separate. Open a card for component detail.","Current observations · stale and no-data states remain literal")}${snapshot(state)}${walkHealth(state)}`;
      if(p==="project")content=state.project?`${trail(state,p)}${walkHead(`PROJECT / ${state.project.key.toUpperCase()}`,state.project.name,"Runs, people, and activity occupy separate tracks without introducing another navigation level.",`${state.project.work} · ${state.project.latest}`)}${snapshot(state)}${walkTracks(state)}<div class="walk-project-lower"><section class="walk-ledger"><div class="s-section-head"><h2>Significant activity</h2><span class="small muted">Latest first</span></div>${eventLines(state)}</section><aside class="walk-fact-card"><h2>Project note</h2><div class="walk-fact"><span class="caps">Health</span>${status(state.project.health)}</div><div class="walk-fact"><span class="caps">Current work</span><strong>${state.project.work}</strong><span class="small muted">${state.project.latest}</span></div><div class="walk-fact"><span class="caps">Participants</span><span>${state.project.participants}</span></div>${technicalDetails(state)}</aside></div>`:`${walkHead("PROJECT","Choose a Project","Use the Project index to open its operating context.")}`;
      if(p==="run")content=state.run?`${trail(state,p)}${walkHead(`RUN / GENERATION ${state.run.generation}`,state.run.title,`${state.run.id} · candidate ${state.run.revision}. Gates are independent checks and may reopen independently.`,`${state.project.name} · literal state ${state.run.state}`)}${snapshot(state)}<div class="walk-tape"><strong>STEERING STATION</strong>${runActions(state)||status(state.run.state)}</div><div class="walk-project-lower"><section><div class="s-section-head"><h2>Independent gates</h2><span class="small muted">Not lifecycle phases</span></div>${walkGateCards(state)}</section><aside class="walk-fact-card"><h2>Run facts</h2><div class="walk-fact"><span class="caps">Literal state</span><strong>${state.run.state}</strong></div><div class="walk-fact"><span class="caps">Derived next move</span><span>${state.run.derived}</span></div><div class="walk-fact"><span class="caps">Review</span><span>${state.run.review} · ${state.run.round}/${state.run.cap}</span></div><div class="walk-fact"><span class="caps">Coordinator</span><span>${state.run.owner}</span></div><details><summary>Evidence and Forge links</summary><div><button class="btn ghost" data-evidence="candidate">Candidate evidence</button><button class="btn ghost" data-evidence="review">Exact review</button><button class="btn ghost" data-evidence="logs">Completed logs</button></div></details></aside></div>`:`${walkHead("RUN","Choose a Run","Select a Project, then one of its Runs from the index.")}`;
      return `<div class="s-shell walk-shell">${topE2(state)}<div class="s-frame">${projectIndex(state)}<main class="s-main"><div class="s-main-content">${content}</div></main></div></div>`;
    }

    function folioHead(index,title,lede,meta=""){ return `<header class="folio-heading"><div class="folio-index">${index}</div><h1 tabindex="-1">${title}</h1><p>${lede}</p>${meta?`<div class="folio-meta">${meta}</div>`:""}</header>`; }
    function folioAlert(state){ const item=state.attention[0]; return item?`<div class="folio-alert"><strong>PINNED</strong><button class="btn ghost" data-attention="${item.key}">${item.title} · ${item.age}</button><a class="text-link" href="${href("inbox")}" data-nav>Inbox ${state.attention.length}</a></div>`:""; }
    function folioProjects(state){ return `<div class="folio-projects">${state.projects.map((project,index)=>`<article class="folio-project-card ${index===0?"feature":""}"><div class="folio-card-number">0${index+1}</div><h2><a class="text-link" href="${projectHref(project.key)}" data-nav>${project.name}</a></h2><p>${status(project.health)}</p><strong>${project.work}</strong><p class="small muted">${project.latest}<br>${project.participants}</p><div class="folio-card-actions"><a class="btn primary" href="${projectHref(project.key)}" data-nav>Open Project</a><button class="btn ghost" data-project-detail="${project.key}">Quick view</button></div></article>`).join("")}</div>`; }
    function folioCases(state){ return `<div class="folio-case-list">${state.attention.map((item,index)=>`<button class="folio-case ${item.level}" data-attention="${item.key}"><span class="folio-case-code">CASE ${String(index+1).padStart(2,"0")}</span><span><strong>${item.title}</strong><span class="attention-summary">${item.summary}</span></span><span class="small muted">${item.scope}<br>${item.age}</span></button>`).join("")}</div>`; }
    function folioRuns(state){ return `<div class="folio-runs">${state.project.runs.map(id=>{const run=state.runs[id];return `<article class="folio-run-card"><div><a class="run-title text-link" href="${runHref(state.project.key,id)}" data-nav>${run.title}</a><div class="sub mono">${run.id} · generation ${run.generation}</div></div><div>${status(run.state)}<div class="sub">${run.derived}</div></div><a class="btn" href="${runHref(state.project.key,id)}" data-nav>Open Run</a></article>`;}).join("")}</div>`; }
    function folioPeople(state){ return `<div class="folio-people">${state.people.map(person=>`<button class="folio-person" data-person="${person.id}"><span class="folio-person-head">${avatar(person)}<span><strong>${person.name}</strong><span class="sub">${person.role} · ${person.actor}</span></span></span><span class="small">${status(person.process)}<br>${status(person.readiness)}</span></button>`).join("")}</div>`; }
    function runJourney(state){
      let steps;
      if(!state.run.current)steps=[{phase:"Candidate",detail:state.run.revision,state:"complete"},{phase:"Evidence",detail:"checks recorded",state:"complete"},{phase:"Review",detail:state.run.review,state:"complete"},{phase:"Human decision",detail:"accepted",state:"complete"},{phase:"Run closed",detail:state.run.derived,state:"complete"}];
      else if(state.run.id!=="run-01J8ZT7G")steps=[{phase:"Implementation",detail:"candidate prepared",state:"complete"},{phase:"Review",detail:state.run.review,state:"complete",feedback:true},{phase:"Implementation",detail:"changes applied",state:"complete"},{phase:"Run paused",detail:state.run.state,state:"current"},{phase:"Operator decision",detail:state.run.derived,state:"future"}];
      else if(state.scenario==="active")steps=[{phase:"Implementation",detail:"prior candidate",state:"complete"},{phase:"Review",detail:`round ${Math.max(1,state.run.round-1)} · changes requested`,state:"complete",feedback:true},{phase:"Implementation",detail:state.run.revision,state:"current"},{phase:"Evidence",detail:"awaiting candidate",state:"future"},{phase:"Review",detail:"next round",state:"future"}];
      else steps=[{phase:"Implementation",detail:"prior candidate",state:"complete"},{phase:"Review",detail:`round ${Math.max(1,state.run.round-1)} · changes requested`,state:"complete",feedback:true},{phase:"Implementation",detail:state.run.revision,state:"complete"},{phase:"Review",detail:`round ${state.run.round} · ${state.run.review}`,state:"complete"},{phase:"Human decision",detail:state.run.derived,state:"current"}];
      return `<section class="run-journey" aria-labelledby="run-journey-title"><div class="run-journey-head"><h2 id="run-journey-title">Run journey</h2><span class="small muted">Chronological observations · separate from gate truth</span></div><div class="run-journey-scroll"><ol class="run-journey-track">${steps.map((step,index)=>`<li class="journey-step ${step.state} ${step.feedback?"feedback":""}"><span class="journey-return">↩ CHANGES REQUESTED</span><span class="journey-dot" aria-hidden="true">${step.state==="complete"?"✓":step.state==="current"?"●":"·"}</span><span class="journey-copy"><span class="journey-phase">${step.phase}</span><span class="journey-detail">${step.detail}</span></span></li>`).join("")}</ol></div></section>`;
    }
    function folioGates(state){ return `<div class="gate-ledger">${variantGates(state).map((gate,index)=>`<button class="gate-ledger-row ${gate.code}" data-gate-index="${index}" data-project="${state.project.key}" data-run="${state.run.id}" aria-label="Open ${gate.name} details"><span class="gate-ledger-code">G${String(index+1).padStart(2,"0")}</span><span class="gate-ledger-copy"><strong>${gate.name}</strong><small>${gate.note}</small></span><span class="gate-ledger-state">${status(gate.state)}</span><span class="gate-ledger-arrow" aria-hidden="true">›</span></button>`).join("")}</div>`; }
    function folioHealth(state){ return `<div class="folio-health-grid">${state.projects.map((project,index)=>`<article class="folio-health-card"><div class="folio-case-code">SHEET 0${index+1}</div><h2 style="margin-top:34px">${project.name}</h2><p>${status(project.health)}</p><div class="walk-fact"><span class="caps">Data quality</span><strong>${project.freshness}</strong><span class="small muted">${project.connection} · ${project.observed}</span></div><button class="btn" data-health-project="${project.key}">Open health sheet</button></article>`).join("")}</div>`; }
    function renderC(state,p){
      let content="";
      if(p==="projects")content=`${folioHead("P","Project field notes","A working desk for Projects, Runs, people, and the few signals that require human judgment.","GLOBAL AREA · PROJECTS")}${snapshot(state)}${folioAlert(state)}${folioProjects(state)}`;
      if(p==="inbox")content=`${folioHead("I","Attention casebook","Each case opens its evidence and only the actions valid for that exact context.",`GLOBAL AREA · INBOX · ${state.attention.length} OPEN CASES`)}${snapshot(state)}${folioCases(state)}`;
      if(p==="health")content=`${folioHead("H","Runtime field checks","Current state, freshness, unknown outcomes, and no-data observations retain their literal meaning.","GLOBAL AREA · HEALTH")}${snapshot(state)}${folioHealth(state)}`;
      if(p==="project")content=state.project?`${trail(state,p)}${folioHead("P",state.project.name,"The selected Project keeps its Runs, Participants, and activity together while technical identity stays folded away.",`${state.project.work.toUpperCase()} · ${state.project.latest.toUpperCase()}`)}${snapshot(state)}<div class="folio-project-layout"><div><section class="folio-section"><div class="folio-section-head"><h2>Runs</h2>${status(state.project.health)}</div>${folioRuns(state)}</section><section class="folio-section"><div class="folio-section-head"><h2>Participants</h2><span class="small muted">Process and readiness stay separate</span></div>${folioPeople(state)}</section><section class="folio-section folio-activity"><div class="folio-section-head"><h2>Significant activity</h2><span class="small muted">Latest first</span></div>${eventLines(state)}</section></div><aside class="folio-side-note"><h2>Project note</h2><p>${status(state.project.health)}</p><div class="walk-fact"><span class="caps">Current work</span><strong>${state.project.work}</strong><span class="small">${state.project.latest}</span></div><div class="walk-fact"><span class="caps">Availability</span><span>${state.project.participants}</span></div>${technicalDetails(state)}</aside></div>`:`${folioHead("P","Choose a Project","Use the Project index to open its field notes.")}`;
      if(p==="run")content=state.run?`${trail(state,p)}${folioHead("R",state.run.title,`${state.run.id} · generation ${state.run.generation}. Independent gate cards report truth without pretending to be sequential phases.`,`${state.project.name.toUpperCase()} · ${state.run.revision.toUpperCase()}`)}${snapshot(state)}${runJourney(state)}<div class="folio-run-layout"><section><div class="folio-section-head"><h2>Gate ledger</h2><span class="small muted">Current independent truth · select a row</span></div>${folioGates(state)}</section><aside class="folio-side-note"><h2>Run note</h2><p>${status(state.run.state)}</p><div class="walk-fact"><span class="caps">Derived next move</span><strong>${state.run.derived}</strong></div><div class="walk-fact"><span class="caps">Review</span><span>${state.run.review} · ${state.run.round}/${state.run.cap}</span></div><div class="walk-fact"><span class="caps">Coordinator</span><span>${state.run.owner}</span></div>${runActions(state)}<details><summary>Evidence and Forge links</summary><div><button class="btn ghost" data-evidence="candidate">Candidate evidence</button><button class="btn ghost" data-evidence="review">Exact review</button><button class="btn ghost" data-evidence="logs">Completed logs</button></div></details></aside></div>`:`${folioHead("R","Choose a Run","Select a Project, then one of its Runs from the index.")}`;
      return `<div class="s-shell folio-shell">${topE2(state)}<div class="s-frame">${projectIndex(state)}<main class="s-main"><div class="s-main-content">${content}</div></main></div></div>`;
    }

    const renderers={C:renderC,D:renderC};
    function tools(){ const keys=Object.keys(variants),current=variant(),index=keys.indexOf(current),previous=keys[(index-1+keys.length)%keys.length],next=keys[(index+1)%keys.length]; return `<div class="prototype-tools"><nav class="prototype-variants" aria-label="Prototype variants"><button data-variant="${previous}" aria-label="Previous variant">←</button><div class="prototype-variant-copy"><strong>Variant ${current}</strong> · ${variants[current]}</div><button data-variant="${next}" aria-label="Next variant">→</button></nav><span class="prototype-divider" aria-hidden="true"></span><label class="row"><span class="tiny muted">Scenario</span><select id="scenario"><option value="active" ${scenario()==="active"?"selected":""}>Active work</option><option value="attention" ${scenario()==="attention"?"selected":""}>Needs decision</option><option value="offline" ${scenario()==="offline"?"selected":""}>Disconnected</option></select></label><a href="https://git.puglab.im/attachments/08d88927-c0d6-4665-b6fe-62a62bf6aa20">Earlier study</a></div>`; }
    function render(focus=false){ const state=cloneState(),p=page(),key=variant(); document.body.className=`v-${key}`; document.getElementById("app").innerHTML=`${renderers[key](state,p)}${tools()}`; document.title=`${variants[key]} · ${p}`; if(focus)requestAnimationFrame(()=>document.querySelector("main h1")?.focus()); }

    function openDrawer(title,body){ lastTrigger=document.activeElement; const d=document.getElementById("drawer"); document.getElementById("drawer-title").textContent=title; document.getElementById("drawer-body").innerHTML=body; d.hidden=false; requestAnimationFrame(()=>document.getElementById("drawer-title").focus()); }
    function closeDrawer(restore=true){ document.getElementById("drawer").hidden=true; if(restore&&lastTrigger?.isConnected)lastTrigger.focus(); }
    function projectDetail(key){ const state=cloneState(),p=state.projects.find(x=>x.key===key); openDrawer(p.name,`<div class="stack"><span>${status(p.health)}</span><div><span class="caps">Current work</span><p><strong>${p.work}</strong><br><span class="muted small">${p.latest}</span></p></div><p class="small">${p.runs.length} current or recent Runs · ${p.participants} · ${p.attention} need attention</p><a class="btn primary" href="${projectHref(p.key)}" data-nav>Open Project</a><details><summary>Technical runtime identity</summary><div><p class="mono">${p.room}<br>${p.deployment}<br>${p.repository}</p></div></details></div>`); }
    function personDetail(id){ const state=cloneState(),person=Object.values(state.participants).flat().find(p=>p.id===id); if(!person)return; const p=state.projects.find(project=>project.runs.includes(person.binding))||state.project||state.projects.find(project=>state.participants[project.key].some(x=>x.id===id)); const scoped=stateFor(p.key,p.runs[0]); const controls=person.process.includes("Alive")?`<div class="action-line">${actionButton("message","Message Participant",scoped,person.id,"primary")}</div>${disabledNote(scoped)}`:`<p class="small muted">No steering action is available because no Participant process is observed.</p>`; openDrawer(person.name,`<p class="muted">${person.role} · Actor Identity ${person.actor}</p><div class="stack"><div>${truth(person.process,"Process observation",p.observed)}</div><div>${truth(person.readiness,"Readiness observation",p.observed)}</div><div><span class="caps">Binding</span><p>${person.binding}</p></div><label class="small">Context · ${person.context}%<progress max="100" value="${person.context}">${person.context}%</progress></label><label class="small">Provider quota · ${person.quota||"No data"}${person.quota?"%":""}<progress max="100" value="${person.quota}">${person.quota}%</progress></label>${controls}</div>`); }
    function healthProject(key){ const state=cloneState(),p=state.projects.find(x=>x.key===key); openDrawer(`${p.name} health`,`<p>${status(p.health)}</p><p class="muted">${p.connection} · data ${p.freshness} · ${p.observed}</p><div style="margin-top:18px">${healthLines(state,key)}</div>`); }
    function healthDetail(key,scope){ const state=stateFor(scope),c=state.health[scope].find(x=>x.key===key); if(!c)return; const controls=["manager","coordination","forge","notifications","audit"].includes(c.key)?`<div class="action-line">${actionButton("recheck","Run check again",state,c.key)}</div>${disabledNote(state)}`:`<p class="small muted">Credential remediation starts through the approved authentication flow, not this read model.</p>`; openDrawer(c.name,`<div class="stack"><span>${status(c.state)}</span><div>${truth(c.quality,c.source,c.observed,"Data quality")}</div><p>${c.note}</p><details><summary>Sanitized diagnostics</summary><div><p>Project: ${state.project.name}</p><p>Check source: ${c.source}</p><p>No secret material, store paths, raw provider bodies, or unsanitized audit rows are projected.</p></div></details>${controls}</div>`); }
    function evidenceDetail(kind){ const state=cloneState(),run=state.run; const body=kind==="logs"?`<p>Completed job log · 846 KiB · complete</p><p>Above 1 MiB the final 1 MiB remains available with truncation metadata.</p>`:kind==="review"?`<p><strong>${run?.review||"No review"}</strong> · round ${run?.round||"—"} of ${run?.cap||"—"}</p><p>The exact review is bound to ${run?.revision||"no candidate"}.</p>`:`<p class="mono">${run?.revision||"No candidate"}</p><p>Mechanical evidence is bound to this exact candidate.</p>`; openDrawer(kind==="logs"?"Completed logs":kind==="review"?"Review evidence":"Candidate evidence",body); }
    function gateDetail(index,projectKey,runId){ const state=stateFor(projectKey,runId),gate=variantGates(state)[Number(index)];if(!gate)return;openDrawer(gate.name,`<div class="stack"><span>${status(gate.state)}</span><p>${gate.note}</p><div>${truth(gate.state,gate.source,gate.observed,"Gate state")}</div><details open><summary>How to read this</summary><div>This row reports the current truth of one independent check. It is not a lifecycle phase. The Run journey records repeated implementation and review visits separately.</div></details>${variantGateAction(gate,state)}</div>`); }

    function openAttention(key){
      const state=cloneState(),item=state.attention.find(x=>x.key===key)||base.attention.find(x=>x.key===key); if(!item)return; lastTrigger=document.activeElement;
      document.getElementById("item-title").textContent=item.title;
      document.getElementById("item-body").innerHTML=`<p class="page-lede">${item.summary}</p><div class="dialog-section"><span class="caps">Why this reached you</span><p>${item.why}</p>${truth(item.scope,"Manager projection",item.age,"Scope")}</div><div class="dialog-section"><span class="caps">Bound evidence</span><ul>${item.evidence.map(x=>`<li>${x}</li>`).join("")}</ul></div><details><summary>Technical action properties</summary><div>Eligibility, generation, policy version, operation identity, and audit references are validated by the owning service. Runtime instance and authenticated Actor Identity are derived, not supplied by this client.</div></details>${item.key==="forge-unknown"?`<div class="receipt"><strong>Outcome unknown — reconciliation required.</strong><p>No automatic retry will occur.</p></div>`:""}`;
      const scoped=stateFor(item.project,item.run||"");
      document.getElementById("item-actions").innerHTML=`<button class="btn" data-close-item>Close</button><a class="btn" href="${item.run?runHref(item.project,item.run):href(item.key==="credential-warning"||item.key==="forge-unknown"?"health":"project",{project:item.project})}" data-nav>Open ${item.run?"Run":"Health"}</a>${item.actions.map(k=>actionButton(k,k==="extend"?"Add review rounds":k==="approve"?"Approve candidate":"Stop and reject Run",scoped,"",k==="extend"?"primary":k==="reject"?"danger":"")).join("")}`;
      const d=document.getElementById("item-dialog");d.showModal();requestAnimationFrame(()=>document.getElementById("item-title").focus());
    }
    function closeItem(restore=true){ const d=document.getElementById("item-dialog");if(d.open)d.close();if(restore&&lastTrigger?.isConnected)lastTrigger.focus(); }

    const actionDefs={
      message:{title:"Send Message",impact:"Queues a typed Message for the selected Participant's next safe delivery point.",submit:"Send Message",field:"Message",placeholder:"What should the Participant know?",owner:"Coordination service"},
      pause:{title:"Pause Run",impact:"Stops new work delivery for this Run. It does not rewrite Forge state or discard work.",submit:"Pause Run",field:"Reason",placeholder:"Why should this Run pause?",owner:"Coordination service"},
      extend:{title:"Extend review cap",impact:"Adds exactly two review rounds and records a policy amendment. It does not approve or merge the candidate.",submit:"Add 2 review rounds",field:"Justification",placeholder:"Why is another review cycle warranted?",owner:"Run Policy"},
      approve:{title:"Approve exact candidate",impact:"Advances only the human gate for the exact candidate. It does not merge, deploy, or waive structural security invariants.",submit:"Approve candidate",field:"Approval note",placeholder:"Why is this candidate acceptable?",owner:"Gate evaluator"},
      override:{title:"Review scoped override",impact:"Waives only the review-round-policy gate for this Run generation. Security invariants remain enforced.",submit:"Apply scoped override",field:"Required justification",placeholder:"Why should this gate be waived?",owner:"Run Policy"},
      reject:{title:"Stop and reject Run",impact:"Stops this Run with a recorded reason. The Forge work item remains separate.",submit:"Stop and reject Run",field:"Required reason",placeholder:"Why should this Run stop?",owner:"Coordination service",destructive:true},
      recheck:{title:"Run health check again",impact:"Requests one typed health recheck. It does not restart a service, rotate credentials, or retry an unknown Forge mutation.",submit:"Run check",field:null,owner:"Health adapter"}
    };
    function payload(kind,target,state,reason=""){ const value={operation_id:`mgr-${Date.now().toString(36)}`,kind}; if(kind==="message"){value.participant_id=target;value.message=reason;value.expected_sequence=18492;} else if(kind==="recheck"){value.component=target;value.expected_observation=state.project.observed;} else {value.run_id=state.run.id;value.generation=state.run.generation;value.expected_candidate=state.run.revision;if(reason)value.reason=reason;} if(kind==="extend"){value.add_rounds=2;value.expected_cap=state.run.cap;} if(kind==="override")value.gate="review-round-policy";return value; }
    function openAction(kind,target,projectKey,runId){
      const state=stateFor(projectKey,runId),def=actionDefs[kind];if(!def||!actionable(state))return;const returnTarget=(document.getElementById("item-dialog").open||!document.getElementById("drawer").hidden)?lastTrigger:document.activeElement;if(document.getElementById("item-dialog").open)closeItem(false);if(!document.getElementById("drawer").hidden)closeDrawer(false);lastTrigger=returnTarget;currentAction={kind,target,state};clearTimeout(actionTimer);
      document.getElementById("action-title").textContent=def.title;document.getElementById("action-body").innerHTML=`<p id="action-impact">${def.impact}</p><div class="dialog-section"><span class="caps">Validated by</span><p>${def.owner}</p>${state.run?`<p class="mono small">${state.run.id} · generation ${state.run.generation} · ${state.run.revision}</p>`:""}</div>${def.field?`<label class="field">${def.field}<textarea id="action-reason" rows="4" required placeholder="${def.placeholder}"></textarea></label>`:""}${def.destructive?`<label class="check"><input id="action-ack" type="checkbox" required><span>I understand this stops the Run and leaves the Forge work item unchanged.</span></label>`:""}<details><summary>Request properties</summary><div><pre class="payload">${JSON.stringify(payload(kind,target,state),null,2)}</pre><p>Project runtime identity and authenticated Actor Identity are derived by the owning service.</p></div></details><div id="action-error" class="form-error" role="alert"></div><div id="action-receipt"></div>`;
      const submit=document.getElementById("action-submit");submit.textContent=def.submit;submit.className=`btn ${def.destructive?"danger":"primary"}`;submit.disabled=false;submit.hidden=false;const d=document.getElementById("action-dialog");d.showModal();requestAnimationFrame(()=>{document.getElementById("action-title").focus();if(def.destructive)document.getElementById("action-cancel").focus();});
    }
    function closeAction(){clearTimeout(actionTimer);const d=document.getElementById("action-dialog");if(d.open)d.close();if(lastTrigger?.isConnected)lastTrigger.focus();}
    function submitAction(event){event.preventDefault();if(!currentAction)return;const{kind,target,state}=currentAction,def=actionDefs[kind],reason=document.getElementById("action-reason")?.value.trim()||"",ack=document.getElementById("action-ack"),error=document.getElementById("action-error");error.textContent="";if(def.field&&!reason){error.textContent=`${def.field} is required.`;document.getElementById("action-reason").focus();return;}if(def.destructive&&ack&&!ack.checked){error.textContent="Acknowledge the stated consequence before continuing.";ack.focus();return;}const value=payload(kind,target,state,reason),submit=document.getElementById("action-submit");submit.disabled=true;document.getElementById("action-receipt").innerHTML=`<div class="receipt pending" role="status"><strong>Request pending</strong><p>The owning service is validating expected state.</p></div>`;actionTimer=setTimeout(()=>{document.getElementById("action-receipt").innerHTML=`<div class="receipt" role="status"><strong>Request confirmed</strong><p>Ledger reference <span class="mono">ledger/${Math.floor(Math.random()*9000+1000)}</span></p><details><summary>Submitted request</summary><div><pre class="payload">${JSON.stringify(value,null,2)}</pre></div></details></div>`;submit.hidden=true;},650);}

    document.addEventListener("click",event=>{
      const nav=event.target.closest("a[data-nav]");if(nav){event.preventDefault();if(document.getElementById("item-dialog").open)closeItem(false);if(!document.getElementById("drawer").hidden)closeDrawer(false);history.pushState({},"",nav.href);render(true);return;}
      const v=event.target.closest("[data-variant]");if(v){setParams({variant:v.dataset.variant},false);return;}
      const item=event.target.closest("[data-attention]");if(item){if(!document.getElementById("drawer").hidden)closeDrawer(false);openAttention(item.dataset.attention);return;}
      const gate=event.target.closest("[data-gate-index]");if(gate){gateDetail(gate.dataset.gateIndex,gate.dataset.project,gate.dataset.run);return;}
      const project=event.target.closest("[data-project-detail]");if(project){projectDetail(project.dataset.projectDetail);return;}
      const person=event.target.closest("[data-person]");if(person){personDetail(person.dataset.person);return;}
      const hp=event.target.closest("[data-health-project]");if(hp){healthProject(hp.dataset.healthProject);return;}
      const health=event.target.closest("[data-health]");if(health){healthDetail(health.dataset.health,health.dataset.healthScope);return;}
      const evidence=event.target.closest("[data-evidence]");if(evidence){evidenceDetail(evidence.dataset.evidence);return;}
      const action=event.target.closest("[data-action]");if(action){openAction(action.dataset.action,action.dataset.target||"",action.dataset.project,action.dataset.run);return;}
      if(event.target.closest("[data-close-drawer]")){closeDrawer();return;}
      if(event.target.closest("[data-close-item]")){closeItem();return;}
      if(event.target.closest("[data-close-action]")){closeAction();return;}
    });
    document.addEventListener("change",event=>{if(event.target.id==="scenario")setParams({scenario:event.target.value},false);});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!document.getElementById("drawer").hidden){closeDrawer();return;}if(!["ArrowLeft","ArrowRight"].includes(event.key)||event.target.closest?.("input,textarea,select,[contenteditable]"))return;const keys=Object.keys(variants),index=keys.indexOf(variant()),step=event.key==="ArrowRight"?1:-1;event.preventDefault();setParams({variant:keys[(index+step+keys.length)%keys.length]},false);});
    document.getElementById("action-form").addEventListener("submit",submitAction);
    window.addEventListener("popstate",()=>render(true));
    render();
  </script>
</body>
</html>
