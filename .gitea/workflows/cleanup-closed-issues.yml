name: Clean up closed issues

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  cleanup:
    runs-on: ai-agents-ci
    steps:
      - name: Remove agent lifecycle labels
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ gitea.api_url }}
          REPO: ${{ gitea.repository }}
          ISSUE: ${{ gitea.event.issue.number }}
        run: |
          set -euo pipefail
          label_ids="$(
            curl -fsS -H "Authorization: token $TOKEN" \
              "$API/repos/$REPO/issues/$ISSUE/labels" |
              jq -r '.[] | select(.name | startswith("agent/")) | .id'
          )"
          for id in $label_ids; do
            curl -fsS -o /dev/null -X DELETE \
              -H "Authorization: token $TOKEN" \
              "$API/repos/$REPO/issues/$ISSUE/labels/$id"
          done
